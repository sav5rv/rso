<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
    </style>
</head>
<body>
    <div id="navbarContainer"></div>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-bookmark-plus"></i>Registrar Movimentação para o pátio credenciado</h2>
            </div>
            <div class="card-body p-4">

                <div class="d-flex flex-column flex-md-row justify-content-between mb-3">
                    <button class="btn btn-gradient me-2 mb-2 mb-md-0" data-bs-toggle="modal" data-bs-target="#adicionarModal">
                        <i class="bi bi-plus-circle"></i> Adicionar Registro
                    </button>
                    <div class="d-flex justify-content-start">
                        <button class="btn btn-success me-2" id="exportXLSXBtn">
                            <i class="bi bi-file-earmark-excel"></i> Exportar XLSX
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="adicionarModal" tabindex="-1" aria-labelledby="adicionarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adicionarModalLabel">Registrar Movimentação: <span id="movNumModal"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3"><label for="addEventoDER" class="form-label">Num evento DER</label><input type="number" class="form-control" id="addEventoDER" required></div>
                        <div class="mb-3"><label for="addAtendDER" class="form-label">Nome atendente DER</label><input type="text" class="form-control" id="addAtendDER"></div>                        
                        <div class="mb-3"><label for="addNumRV" class="form-label">Número do RV</label><input type="number" class="form-control" id="addNumRV"></div>
                        <div class="mb-3"><label for="addNumBO" class="form-label">Número do BO</label><input type="text" class="form-control" id="addNumBO"></div>            
                        <div class="mb-3"><label for="addSituacao" class="form-label">Situação do veículo</label><input type="text" class="form-control" id="addSituacao"></div>
                        <div class="mb-3"><label for="addMarca" class="form-label">Marca do veículo</label><input type="text" class="form-control" id="addMarca"></div>
                        <div class="mb-3"><label for="addModelo" class="form-label">Modelo do veículo</label><input type="text" class="form-control" id="addModelo"></div>
                        <div class="mb-3"><label for="addPlaca" class="form-label">Placa do veículo</label><input type="text" class="form-control" id="addPlaca"></div>
                        <div class="mb-3"><label for="addPatioDt" class="form-label">Data movimentação</label><input type="date" class="form-control" id="addPatioDt"></div>
                        <div class="mb-3"><label for="addPatioLoc" class="form-label">Localização movimentação</label><input type="text" class="form-control" id="addPatioLoc"></div>
                        <div class="mb-3"><label for="addGuinchoPlaca" class="form-label">Placa do guincho</label><input type="text" class="form-control" id="addGuinchoPlaca"></div>
                        <div class="mb-3"><label for="addGuinchoNome" class="form-label">Nome do guincheiro</label><input type="text" class="form-control" id="addGuinchoNome"></div>
                        <div class="mb-3"><label for="addNumMsg" class="form-label">Núm Msg ao P3</label><input type="number" class="form-control" id="addNumMsg"></div>
                        <div class="mb-3"><label for="addObs" class="form-label">Observações</label><input type="text" class="form-control" id="addObs"></div>
                        </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="salvarAdicionar">Salvar</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3001/api/mov';

        function getFormData() {
            return {
                eventoDER: $('#addEventoDER').val(),
                atendDER: $('#addAtendDER').val(),
                numRV: $('#addNumRV').val(),
                numBO: $('#addNumBO').val(),
                situacao: $('#addSituacao').val(),
                marca: $('#addMarca').val(),
                modelo: $('#addModelo').val(),
                placa: $('#addPlaca').val(),
                patioDt: $('#addPatioDt').val(),
                patioLoc: $('#addPatioLoc').val(),
                guinchoPlaca: $('#addGuinchoPlaca').val(),
                guinchoNome: $('#addGuinchoNome').val(),
                numMsg: $('#addNumMsg').val(),
                obs: $('#addObs').val()
            };
        }

        $(document).ready(function() {
            $("#navbarContainer").load("mov_navbar.html");

            // Lógica para salvar novo registro
            $('#salvarAdicionar').click(function() {
                const data = getFormData();
                $.ajax({
                    url: API_URL,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function(response) {
                        $('#adicionarModal').modal('hide');
                        $('#addForm')[0].reset();
                        if (response && response.numReg && response.placa) {
                            alert(`Movimentação número ${response.numReg} do veículo Placas: ${response.placa} salva com sucesso!`);
                        } else {
                            alert('Registro salvo com sucesso!');
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error('Erro ao salvar registro:', error);
                        alert('Ocorreu um erro ao salvar o registro. Tente novamente.');
                    }
                });
            });

            // Lógica para exportar para XLSX
            $('#exportXLSXBtn').on('click', function() {
                $.get(API_URL, function(movs) {
                    const dataToExport = movs.map(mov => ({
                        'Num Reg': mov.numReg,
                        'Num evento DER': mov.eventoDER,
                        'Nome atendente': mov.atendDER,
                        'Num BO': mov.numBO,
                        'Situação': mov.situacao,
                        'Marca': mov.marca,
                        'Modelo': mov.modelo,
                        'Placa': mov.placa,
                        'Dt mov pátio': mov.patioDt,
                        'Cidade pátio': mov.patioLoc,
                        'Placa guincho': mov.guinchoPlaca,
                        'Nome Guincheiro': mov.guinchoNome,
                        'Num msg P3': mov.numMsg,
                        'Observações': mov.obs,
                    }));

                    const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Registros de movimentação de veículos ao pátio credenciado");
                    XLSX.writeFile(workbook, "movimentacoes_patio.xlsx");
                });
            });

            // Lógica para a máscara de placas (AAA-0L00)
            $('#addPlaca, #addGuinchoPlaca').mask('AAA-0L00', {
                translation: {
                    'A': { pattern: /[A-Za-z]/ },
                    'L': { pattern: /[A-Za-z0-9]/ },
                    '0': { pattern: /[0-9]/ }
                },
                // Este `onKeyPress` garante que as letras sejam sempre maiúsculas
                onKeyPress: function(val, e, field, options) {
                    field.val(val.toUpperCase());
                }
            });
        });
    </script>
</body>
</html>
