<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-s cale=1.0">
    <title>Resumo CGP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 0.75rem 1.25rem;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
        .tree-node {
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 5px;
            font-weight: bold;
            display: block;
            background-color: #e9ecef;
            transition: background-color 0.2s;
        }
        .tree-node:hover {
            background-color: #cfd7e0;
        }
        .tree-node.expanded i.bi-caret-right-fill {
            transform: rotate(90deg);
        }
        .node-content {
            margin-left: 20px;
            padding-left: 10px;
            border-left: 2px solid #ccc;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-shield-check"></i> Sistema</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cadastro.html"><i class="bi bi-person-plus"></i> Cadastro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="rso.html"><i class="bi bi-table"></i> RSO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="consulta-rso.html"><i class="bi bi-search"></i> Consulta</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="bi bi-graph-up"></i> Resumo</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-graph-up me-2"></i>Resumo CGP</h2>
            </div>
            <div class="card-body p-4">
                <div class="d-flex flex-wrap mb-4 justify-content-center">
                    <button class="btn btn-outline-primary m-1" id="btnFiltroData">Data</button>
                    <button class="btn btn-outline-primary m-1" id="btnFiltroMes">Mês</button>
                    <button class="btn btn-outline-primary m-1" id="btnFiltroPeriodo">Período</button>
                    <button class="btn btn-outline-primary m-1" id="btnFiltroCgp">CGP</button>
                    <button class="btn btn-outline-secondary m-1" id="btnReset">Resetar</button>
                </div>
                
                <div id="treeContainer">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3001/api/rso/buscar';
        const camposQtd = ['qtdFisc', 'qtdAut', 'qtdBO', 'qtdARV', 'qtdARD', 'qtdImg', 'qtdTestes'];
        let allRecords = []; // Armazenará todos os registros para re-filtragem local

        // Funções de auxílio
        function getPeriodo(hora) {
            const [horas, minutos] = hora.split(':').map(Number);
            const totalMinutos = horas * 60 + minutos;

            if (totalMinutos >= 360 && totalMinutos <= 720) return 'Manhã (06h - 12h)';
            if (totalMinutos > 720 && totalMinutos <= 1080) return 'Tarde (12h01 - 18h)';
            if (totalMinutos > 1080 && totalMinutos <= 1440) return 'Noite (18h01 - 00h)';
            return 'Madrugada (00h01 - 05h59)';
        }

        function getMonthName(month) {
            const date = new Date();
            date.setMonth(month - 1);
            return date.toLocaleString('pt-BR', { month: 'long' });
        }
        
        // Função para construir a árvore com base no campo de agrupamento
        function buildTree(data, groupBy) {
            const treeData = {};
        
            data.forEach(rso => {
                const periodo = getPeriodo(rso.hrInicio);
                const mes = getMonthName(new Date(rso.data).getMonth() + 1);
                const cgp = rso.cgp || 'CGP Não Informado';
                const bop = rso.bop || 'BOP Não Informado';
                const servico = rso.tpSvc || 'Serviço Não Informado';
                const vtr = rso.vtr || 'VTR Não Informada';
                const auxiliar = rso.aux1 || 'Auxiliar Não Informado';
                const dataSimples = rso.data;
        
                let groupKey;
                switch(groupBy) {
                    case 'data': groupKey = dataSimples; break;
                    case 'mes': groupKey = mes; break;
                    case 'periodo': groupKey = periodo; break;
                    case 'cgp': groupKey = cgp; break;
                    default: groupKey = '';
                }

                // Cria a estrutura da árvore com base na chave de agrupamento
                if (!treeData[groupKey]) treeData[groupKey] = {};
                if (!treeData[groupKey][bop]) treeData[groupKey][bop] = {};
                if (!treeData[groupKey][bop][servico]) treeData[groupKey][bop][servico] = {};
                if (!treeData[groupKey][bop][servico][vtr]) treeData[groupKey][bop][servico][vtr] = {};
                if (!treeData[groupKey][bop][servico][vtr][auxiliar]) {
                    treeData[groupKey][bop][servico][vtr][auxiliar] = {};
                }
        
                // Soma os campos QTD
                camposQtd.forEach(campo => {
                    treeData[groupKey][bop][servico][vtr][auxiliar][campo] = (treeData[groupKey][bop][servico][vtr][auxiliar][campo] || 0) + (rso[campo] || 0);
                });
            });
        
            renderTree(treeData, $('#treeContainer'));
        }
        
        function renderTree(data, parentElement, level = 0) {
            parentElement.empty();
            const ul = $('<ul>').css({ 'list-style': 'none', 'padding-left': 0 });
            for (const key in data) {
                const item = data[key];
                const li = $('<li>');
                
                let hasChildren = false;
                if (typeof item === 'object' && item !== null) {
                    hasChildren = Object.keys(item).some(childKey => !camposQtd.includes(childKey));
                }
        
                let nodeHtml = `<div class="tree-node"><i class="bi bi-caret-right-fill"></i> ${key}</div>`;
                const nodeDiv = $(nodeHtml);
                li.append(nodeDiv);
        
                if (hasChildren) {
                    const contentDiv = $('<div>').addClass('node-content').hide();
                    li.append(contentDiv);
                    renderTree(item, contentDiv, level + 1);
        
                    nodeDiv.on('click', function() {
                        $(this).toggleClass('expanded');
                        contentDiv.slideToggle(200);
                    });
                }
        
                if (level === 4) {
                    const fieldsHtml = camposQtd.map(campo => {
                        const nomeCampo = campo.replace('qtd', 'Qtd ').replace('qtd', 'Qtd ').replace(/([A-Z])/g, ' $1').trim();
                        return `<div><small><strong>${nomeCampo}:</strong> ${item[campo] || 0}</small></div>`;
                    }).join('');
                    li.append($('<div class="node-content">').html(fieldsHtml));
                }
        
                ul.append(li);
            }
            parentElement.append(ul);
        }

        // Event Listeners dos botões
        $(document).ready(function() {
            // Carrega todos os registros quando a página inicia
            $.get(API_URL, function(rsos) {
                allRecords = rsos;
                // Constrói a árvore inicial por data
                buildTree(allRecords, 'data');
            });

            $('#btnFiltroData').on('click', () => buildTree(allRecords, 'data'));
            $('#btnFiltroMes').on('click', () => buildTree(allRecords, 'mes'));
            $('#btnFiltroPeriodo').on('click', () => buildTree(allRecords, 'periodo'));
            $('#btnFiltroCgp').on('click', () => buildTree(allRecords, 'cgp'));
            $('#btnReset').on('click', () => buildTree(allRecords, 'data')); // Resetar volta para o filtro de data
        });
    </script>
</body>
</html>
