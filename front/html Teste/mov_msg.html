<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta RSO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 0.5rem 0.75rem;
        }
        .card-body-sm {
            padding: 0.5rem 0.5rem !important;
        }
        .card-body-sm h4 {
            margin: 0;
            font-size: 1.25rem;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
        .table-responsive {
            border-radius: 0.5rem;
            overflow: auto;
        }
        .btn-action {
            margin: 0 3px;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #rsoTable th, #rsoTable td {
            white-space: nowrap;
        }
        .outlook-modal .form-label {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .outlook-modal .form-control, .outlook-modal .form-select {
            margin-bottom: 0.75rem;
        }
        .preview-container {
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-top: 1rem;
            background-color: #f8f9fa;
            max-height: 300px;
            overflow-y: auto;
        }
        .modal-lg-custom {
            max-width: 900px;
        }
    </style>
</head>
<body>
    <div id="navbarContainer"></div>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-search me-2"></i>Consulta de Movimentação veículos ao pátio credenciado</h2>
            </div>
            <div class="card-body p-4">
                <div class="d-flex mb-3 align-items-end">

                    <div class="me-2">
                        <label for="filtroMes" class="form-label">Mês:</label>
                        <select class="form-control" id="filtroMes">
                            <option value="">Todos</option>
                            <option value="01">Janeiro</option>
                            <option value="02">Fevereiro</option>
                            <option value="03">Março</option>
                            <option value="04">Abril</option>
                            <option value="05">Maio</option>
                            <option value="06">Junho</option>
                            <option value="07">Julho</option>
                            <option value="08">Agosto</option>
                            <option value="09">Setembro</option>
                            <option value="10">Outubro</option>
                            <option value="11">Novembro</option>
                            <option value="12">Dezembro</option>
                        </select>
                    </div>                    
                    
                    <div class="me-2">
                        <label for="filtroPlaca" class="form-label">Placa:</label>
                        <input type="text" class="form-control" id="filtroPlaca" placeholder="XXX-1234">
                    </div>                    

                    <button id="btnFiltrar" class="btn btn-gradient me-2">
                        <i class="bi bi-filter"></i> Filtrar
                    </button>
                    <button id="btnReset" class="btn btn-secondary">
                        <i class="bi bi-arrow-clockwise"></i> Resetar
                    </button>
                </div>
                
                <div class="progress mb-3" id="loadingProgressBar" style="display: none;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
                </div>

                <div class="table-responsive">
                    <table id="movTable" class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Num Reg</th>
                                <th>Evento DER</th>
                                <th>Atendente DER</th>
                                <th>RV</th>
                                <th>BO</th>
                                <th>Situação</th>
                                <th>Marca</th>
                                <th>Modelo</th>
                                <th>Placa</th>
                                <th>Dt moviment</th>
                                <th>Cidade Pátio</th>
                                <th>Placa Guincho</th>
                                <th>Nome Guincheiro</th>
                                <th>Msg P3</th>
                                <th>Obs</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="movTableBody">
                            <!-- Dados serão preenchidos via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Gerar Mensagem Outlook -->
    <div class="modal fade" id="outlookModal" tabindex="-1" aria-labelledby="outlookModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-lg-custom">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="outlookModalLabel"><i class="bi bi-envelope-plus me-2"></i>Gerar Mensagem para Outlook</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body outlook-modal">
                    <form id="outlookForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="destinatario" class="form-label">Destinatário:</label>
                                    <input type="email" class="form-control" id="destinatario" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="assunto" class="form-label">Assunto:</label>
                                    <input type="text" class="form-control" id="assunto" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="placa" class="form-label">Placa do Veículo:</label>
                                    <input type="text" class="form-control" id="placa">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="marca" class="form-label">Marca:</label>
                                    <input type="text" class="form-control" id="marca">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="modelo" class="form-label">Modelo:</label>
                                    <input type="text" class="form-control" id="modelo">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="numReg" class="form-label">Número do Registro:</label>
                                    <input type="text" class="form-control" id="numReg">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="dataMovimentacao" class="form-label">Data de Movimentação:</label>
                                    <input type="text" class="form-control" id="dataMovimentacao">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="mensagem" class="form-label">Mensagem:</label>
                            <textarea class="form-control" id="mensagem" rows="5" required></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Pré-visualização da Mensagem:</label>
                            <div class="preview-container" id="previewMensagem">
                                <!-- A pré-visualização será gerada aqui -->
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary" id="btnGerarOutlook">
                        <i class="bi bi-envelope-plus me-1"></i> Gerar Mensagem no Outlook
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    
    <script>
        const API_URL = 'http://localhost:3001/api/mov/buscar';
        let dataTable;
        let currentMovimentacao = {};

        $(function(){
            $("#navbarContainer").load("mov_navbar.html");
        });

        function renderTable(movs) {
            if ($.fn.DataTable.isDataTable('#movTable')) {
                $('#movTable').DataTable().destroy();
            }
            const tbody = $('#movTableBody');
            tbody.empty();

            movs.forEach(mov => {
                let dataFormatada = '';
                if (mov.patioDt) {
                    const partes = mov.patioDt.split('-');
                    if (partes.length === 3) {
                        dataFormatada = `${partes[2]}-${partes[1]}-${partes[0]}`;
                    } else {
                        dataFormatada = mov.patioDt;
                    }
                }

                tbody.append(`
                    <tr>
                        <td>${mov.numReg || ''}</td>
                        <td>${mov.eventoDER || ''}</td>
                        <td>${mov.atendDER || ''}</td>
                        <td>${mov.numRV || ''}</td>
                        <td>${mov.numBO || ''}</td>
                        <td>${mov.situacao || ''}</td>
                        <td>${mov.marca || ''}</td>
                        <td>${mov.modelo || ''}</td>
                        <td>${mov.placa || ''}</td>
                        <td>${dataFormatada || ''}</td>
                        <td>${mov.patioLoc || ''}</td>
                        <td>${mov.guinchoPlaca || ''}</td>
                        <td>${mov.guinchoNome || ''}</td>
                        <td>${mov.numMsg || ''}</td>
                        <td>${mov.obs || ''}</td>
                        <td>
                            <button class="btn btn-sm btn-outlook btn-action" title="Gerar mensagem Outlook" onclick="abrirModalOutlook(${JSON.stringify(mov).replace(/"/g, '&quot;')})">
                                <i class="bi bi-envelope-plus"></i>
                            </button>
                        </td>
                    </tr>
                `);
            });

            // Inicializa o DataTable com os dados populados
            dataTable = $('#movTable').DataTable({
                language: {
                    url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json"
                },
                destroy: true,
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'excelHtml5',
                        text: '<i class="bi bi-file-earmark-excel"></i> Exportar XLSX',
                        className: 'btn btn-success'
                    },
                    {
                        extend: 'pdfHtml5',
                        text: '<i class="bi bi-file-earmark-pdf"></i> Exportar PDF',
                        className: 'btn btn-danger'
                    },
                    {
                        extend: 'print',
                        text: '<i class="bi bi-printer"></i> Imprimir',
                        className: 'btn btn-secondary'
                    }
                ],
                columnDefs: [
                    { orderable: false, targets: 15 } // Desabilita ordenação na coluna de ações
                ]
            });
        }

        function fetchDataAndRender(url) {
            $('#loadingProgressBar').show();
            $.get(url, function(data) {
                renderTable(data);
            }).always(function() {
                $('#loadingProgressBar').hide();
            });
        }

        $('#btnFiltrar').on('click', function() {
            const filtroPlaca = $('#filtroPlaca').val();
            const filtroMes = $('#filtroMes').val();

            const params = {};
            if (filtroPlaca !== '') {
                params.placa = filtroPlaca;
            }
            if (filtroMes !== '') {
                params.mes = filtroMes;
            }

            const queryString = $.param(params);
            const url = `${API_URL}?${queryString}`;
            fetchDataAndRender(url);
        });

        $('#btnReset').on('click', function() {
            $('#filtroPlaca').val('');
            $('#filtroMes').val('');
            
            const allRecordsUrl = API_URL.replace('/buscar', '');
            fetchDataAndRender(allRecordsUrl);
        });

        // Função para abrir o modal com os dados da movimentação
        window.abrirModalOutlook = function(mov) {
            currentMovimentacao = mov;
            
            // Formatar a data
            let dataFormatada = '';
            if (mov.patioDt) {
                const partes = mov.patioDt.split('-');
                if (partes.length === 3) {
                    dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
                } else {
                    dataFormatada = mov.patioDt;
                }
            }
            
            // Preencher o formulário com os dados
            $('#destinatario').val(''); // Limpar o campo de destinatário
            $('#assunto').val(`Movimentação de Veículo - Placa: ${mov.placa || 'N/A'}`);
            $('#placa').val(mov.placa || '');
            $('#marca').val(mov.marca || '');
            $('#modelo').val(mov.modelo || '');
            $('#numReg').val(mov.numReg || '');
            $('#dataMovimentacao').val(dataFormatada);
            
            // Gerar mensagem padrão
            const mensagemPadrao = `Prezados,\n\nInformamos a movimentação do veículo com as seguintes características:\n\n` +
                                   `Placa: ${mov.placa || 'N/A'}\n` +
                                   `Marca/Modelo: ${mov.marca || 'N/A'} / ${mov.modelo || 'N/A'}\n` +
                                   `Nº do Registro: ${mov.numReg || 'N/A'}\n` +
                                   `Data de Movimentação: ${dataFormatada}\n` +
                                   `Local do Pátio: ${mov.patioLoc || 'N/A'}\n` +
                                   `Situação: ${mov.situacao || 'N/A'}\n\n` +
                                   `Atenciosamente,\n` +
                                   `Equipe de Operações`;
            
            $('#mensagem').val(mensagemPadrao);
            
            // Atualizar a pré-visualização
            atualizarPreview();
            
            // Abrir o modal
            const outlookModal = new bootstrap.Modal(document.getElementById('outlookModal'));
            outlookModal.show();
        };

        // Função para atualizar a pré-visualização da mensagem
        function atualizarPreview() {
            const destinatario = $('#destinatario').val();
            const assunto = $('#assunto').val();
            const mensagem = $('#mensagem').val().replace(/\n/g, '<br>');
            
            const previewHtml = `
                <p><strong>Para:</strong> ${destinatario || '[Destinatário]'}</p>
                <p><strong>Assunto:</strong> ${assunto || '[Assunto]'}</p>
                <hr>
                <div>${mensagem || '[Mensagem]'}</div>
            `;
            
            $('#previewMensagem').html(previewHtml);
        }

        // Atualizar a pré-visualização quando os campos mudarem
        $('#destinatario, #assunto, #mensagem').on('input', atualizarPreview);

        // Gerar mensagem no Outlook
        $('#btnGerarOutlook').on('click', function() {
            const destinatario = $('#destinatario').val();
            const assunto = $('#assunto').val();
            const mensagem = $('#mensagem').val();
            
            if (!destinatario || !assunto || !mensagem) {
                alert('Por favor, preencha todos os campos obrigatórios.');
                return;
            }
            
            // Codificar os parâmetros para o mailto
            const assuntoCodificado = encodeURIComponent(assunto);
            const mensagemCodificada = encodeURIComponent(mensagem);
            
            // Criar o link mailto
            const mailtoLink = `mailto:${destinatario}?subject=${assuntoCodificado}&body=${mensagemCodificada}`;
            
            // Abrir o cliente de e-mail
            window.location.href = mailtoLink;
            
            // Fechar o modal
            bootstrap.Modal.getInstance(document.getElementById('outlookModal')).hide();
        });

        // Carrega os dados iniciais ao carregar a página
        $(document).ready(function() {
            const allRecordsUrl = API_URL.replace('/buscar', '');
            fetchDataAndRender(allRecordsUrl);
        });

        // Lógica para a máscara de placas (LLL-NLNN)
        $('#filtroPlaca').mask('AAA-0L00', {
            translation: {
                'A': { pattern: /[A-Za-z]/ },
                'L': { pattern: /[A-Za-z0-9]/ },
                '0': { pattern: /[0-9]/ }
            },
            onKeyPress: function(val, e, field, options) {
                field.val(val.toUpperCase());
            }
        });
    </script>
</body>
</html>
