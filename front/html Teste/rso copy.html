<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
        .table-responsive {
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .btn-action {
            margin: 0 3px;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        /* Oculta as colunas de exportação para que não poluam a visualização */
        .export-only {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="navbarContainer"></div>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-table me-2"></i>Registros RSO</h2>
            </div>
            <div class="card-body p-4">
                <div class="d-flex justify-content-between mb-3">
                    <button class="btn btn-gradient" data-bs-toggle="modal" data-bs-target="#adicionarModal">
                        <i class="bi bi-plus-circle"></i> Adicionar Registro
                    </button>
                </div>
                
                <div class="table-responsive">
                    <table id="rsoTable" class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>RSO Num</th>
                                <th>Data</th>
                                <th>PPRi</th>
                                <th>Viatura</th>
                                <th>CGP</th>
                                <th>BOp</th>
                                <th>Ações</th>
                                <th class="export-only">Hora Início</th>
                                <th class="export-only">Serviço</th>
                                <th class="export-only">Aux-1</th>
                                <th class="export-only">Aux-2</th>
                                <th class="export-only">Aux-3</th>
                                <th class="export-only">Qtd Fisc</th>
                                <th class="export-only">Qtd Aut</th>
                                <th class="export-only">Qtd BO</th>
                                <th class="export-only">Qtd ARV</th>
                                <th class="export-only">Qtd ARD</th>
                                <th class="export-only">Qtd Img</th>
                                <th class="export-only">Qtd Testes</th>
                            </tr>
                        </thead>
                        <tbody id="rsoTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="detalhesModal" tabindex="-1" aria-labelledby="detalhesModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detalhesModalLabel">Detalhes do Registro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editarModalLabel">Editar Registro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3"><label for="editData" class="form-label">Data</label><input type="date" class="form-control" id="editData" required></div>
                        <div class="mb-3"><label for="editHrInicio" class="form-label">Hora Início</label><input type="text" class="form-control" id="editHrInicio"></div>                        
                        <div class="mb-3"><label for="editNumPPRi" class="form-label">numPPRi</label><input type="text" class="form-control" id="editNumPPRi"></div>
                        <div class="mb-3"><label for="editCgp" class="form-label">CGP</label><input type="text" class="form-control" id="editCgp"></div>
                        <div class="mb-3">
                            <label for="editVtr" class="form-label">VTR</label>
                            <input type="text" class="form-control" id="editVtr" placeholder="B-1234">
                            <small class="form-text text-muted">Formato: B-1234</small>
                        </div>
                        <div class="mb-3">
                            <label for="editBop" class="form-label">BOP</label>
                            <select class="form-control" id="editBop">
                                <option value="">Selecione</option>
                                <option value="270/5">127/2</option>
                                <option value="270/5">258/1</option>
                                <option value="270/5">258/2</option>
                                <option value="270/5">270/5</option>
                                <option value="270/6">270/6</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editTpSvc" class="form-label">Tipo Serviço</label>
                            <select class="form-control" id="editTpSvc">
                                <option value="">Selecione</option>
                                <option value="ADM">ADM</option>
                                <option value="CGP">CGP</option>
                                <option value="CMT">CMT</option>
                                <option value="Dejem">Dejem</option>
                                <option value="Escala Extra">Escala Extra</option>
                                <option value="Guarda Quartel">Guarda Quartel</option>
                                <option value="OPERACIONAL">OPERACIONAL</option>
                                <option value="PDR">PDR</option>
                                <option value="Reforço Op">Reforço Op</option>
                                <option value="TOR">TOR</option>
                            </select>
                        </div>
                        <div class="mb-3"><label for="editAux1" class="form-label">Aux1</label><input type="text" class="form-control" id="editAux1"></div>
                        <div class="mb-3"><label for="editAux2" class="form-label">Aux2</label><input type="text" class="form-control" id="editAux2"></div>
                        <div class="mb-3"><label for="editAux3" class="form-label">Aux3</label><input type="text" class="form-control" id="editAux3"></div>
                        <div class="mb-3"><label for="editQtdFisc" class="form-label">Qtd Fisc</label><input type="number" class="form-control" id="editQtdFisc"></div>
                        <div class="mb-3"><label for="editQtdAut" class="form-label">Qtd Aut</label><input type="number" class="form-control" id="editQtdAut"></div>
                        <div class="mb-3"><label for="editQtdBO" class="form-label">Qtd BO</label><input type="number" class="form-control" id="editQtdBO"></div>
                        <div class="mb-3"><label for="editQtdARV" class="form-label">Qtd ARV</label><input type="number" class="form-control" id="editQtdARV"></div>
                        <div class="mb-3"><label for="editQtdARD" class="form-label">Qtd ARD</label><input type="number" class="form-control" id="editQtdARD"></div>
                        <div class="mb-3"><label for="editQtdImg" class="form-label">Qtd Img</label><input type="number" class="form-control" id="editQtdImg"></div>
                        <div class="mb-3"><label for="editQtdTestes" class="form-label">Qtd Testes</label><input type="number" class="form-control" id="editQtdTestes"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="salvarEdicao">Salvar</button>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="adicionarModal" tabindex="-1" aria-labelledby="adicionarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adicionarModalLabel">Registrar R.S.O.</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3"><label for="addData" class="form-label">Data</label><input type="date" class="form-control" id="addData" required></div>
                        <div class="mb-3"><label for="addHrInicio" class="form-label">Hora Início</label><input type="text" class="form-control" id="addHrInicio"></div>                        
                        <div class="mb-3"><label for="addNumPPRi" class="form-label">Número do PPRi</label><input type="number" class="form-control" id="addNumPPRi"></div>
                        <div class="mb-3"><label for="addCgp" class="form-label">CGP</label><input type="text" class="form-control" id="addCgp"></div>
                        <div class="mb-3">
                            <label for="addVtr" class="form-label">Viatura</label>
                            <input type="text" class="form-control" id="addVtr" placeholder="B-1234">
                            </div>
                        <div class="mb-3">
                            <label for="addBop" class="form-label">Base Operacional</label>
                            <select class="form-control" id="addBop">
                                <option value="">Selecione</option>
                                <option value="270/5">127/2</option>
                                <option value="270/5">258/1</option>
                                <option value="270/5">258/2</option>
                                <option value="270/5">270/5</option>
                                <option value="270/6">270/6</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="addTpSvc" class="form-label">Tipo Serviço</label>
                            <select class="form-control" id="addTpSvc">
                                <option value="">Selecione</option>
                                <option value="ADM">ADM</option>
                                <option value="CGP">CGP</option>
                                <option value="CMT">CMT</option>
                                <option value="Dejem">Dejem</option>
                                <option value="Escala Extra">Escala Extra</option>
                                <option value="Guarda Quartel">Guarda Quartel</option>
                                <option value="OPERACIONAL">OPERACIONAL</option>
                                <option value="PDR">PDR</option>
                                <option value="Reforço Op">Reforço Op</option>
                                <option value="TOR">TOR</option>
                            </select>
                        </div>                        
                        <div class="mb-3"><label for="addAux1" class="form-label">Auxiliar 1</label><input type="text" class="form-control" id="addAux1"></div>
                        <div class="mb-3"><label for="addAux2" class="form-label">Auxiliar 2</label><input type="text" class="form-control" id="addAux2"></div>
                        <div class="mb-3"><label for="addAux3" class="form-label">Auxiliar 3</label><input type="text" class="form-control" id="addAux3"></div>
                        </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="salvarAdicionar">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>


    <script>
        const API_URL = 'http://localhost:3001/api/rso';

        // ...existing code...
        let dataTable;

        function renderTable(rsos) {
            // Se já existe, destrói para evitar duplicidade
            if ($.fn.DataTable.isDataTable('#rsoTable')) {
                $('#rsoTable').DataTable().destroy();
            }
            const tbody = $('#rsoTableBody');
            tbody.empty();
            rsos.forEach(rso => {
                // Formata o campo data para DD-MM-YYYY
                let dataFormatada = '';
                if (rso.data) {
                    const partes = rso.data.split('-');
                    if (partes.length === 3) {
                        dataFormatada = `${partes[2]}-${partes[1]}-${partes[0]}`;
                    } else {
                        dataFormatada = rso.data;
                    }
                }
                tbody.append(`
                    <tr>
                        <td>${rso.numRSO || ''}</td>
                        <td>${dataFormatada || ''}</td>
                        <td>${rso.numPPRi || ''}</td>
                        <td>${rso.vtr || ''}</td>
                        <td>${rso.cgp || ''}</td>
                        <td>${rso.bop || ''}</td>
                        <td>
                            <button class="btn btn-info btn-action btn-details" data-id="${rso._id}" data-bs-toggle="modal" data-bs-target="#detalhesModal">
                                <i class="bi bi-eye"></i>
                            </button>
                        </td>
                        <td class="export-only">${rso.hrInicio || ''}</td>
                        <td class="export-only">${rso.tpSvc || ''}</td>
                        <td class="export-only">${rso.aux1 || ''}</td>
                        <td class="export-only">${rso.aux2 || ''}</td>
                        <td class="export-only">${rso.aux3 || ''}</td>
                        <td class="export-only">${rso.qtdFisc || ''}</td>
                        <td class="export-only">${rso.qtdAut || ''}</td>
                        <td class="export-only">${rso.qtdBO || ''}</td>
                        <td class="export-only">${rso.qtdARV || ''}</td>
                        <td class="export-only">${rso.qtdARD || ''}</td>
                        <td class="export-only">${rso.qtdImg || ''}</td>
                        <td class="export-only">${rso.qtdTestes || ''}</td>
                    </tr>
                `);
            });

            // Inicializa o DataTable
            dataTable = $('#rsoTable').DataTable({
                order: [[0, 'desc']], // Ordena por numRSO decrescente
                language: {
                    // url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json" //caminho online mais lento, CORS trava
                    url: "pt-BR.json" //caminho local
                },
                destroy: true,
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'excelHtml5',
                        text: '<i class="bi bi-file-earmark-excel"></i> Exportar XLSX',
                        className: 'btn btn-success'
                    },
                    {
                        extend: 'pdfHtml5',
                        text: '<i class="bi bi-file-earmark-pdf"></i> Exportar PDF',
                        className: 'btn btn-danger'
                    },
                    {
                        extend: 'print',
                        text: '<i class="bi bi-printer"></i> Imprimir',
                        className: 'btn btn-secondary'
                    }
                ]
            });

        }


        function getFormData() {
            return {
                numRSO: $('#addNumRSO').val(),
                data: $('#addData').val(),
                numPPRi: $('#addNumPPRi').val(),
                cgp: $('#addCgp').val(),
                vtr: $('#addVtr').val(),
                bop: $('#addBop').val(),
                tpSvc: $('#addTpSvc').val(),
                aux1: $('#addAux1').val(),
                aux2: $('#addAux2').val(),
                aux3: $('#addAux3').val(),
                hrInicio: $('#addHrInicio').val(),
                qtdFisc: $('#addQtdFisc').val(),
                qtdAut: $('#addQtdAut').val(),
                qtdBO: $('#addQtdBO').val(),
                qtdARV: $('#addQtdARV').val(),
                qtdARD: $('#addQtdARD').val(),
                qtdImg: $('#addQtdImg').val(),
                qtdTestes: $('#addQtdTestes').val()
            };
        }

        $(document).ready(function() {
            // Carregar registros
            $.get(API_URL, renderTable);

            
            // Carrega o conteúdo do navbar.html
            $(function(){
                $("#navbarContainer").load("navbar.html");
            });

            // Adicionar registro
            $('#salvarAdicionar').click(function() {
                const data = getFormData();
                $.ajax({
                    url: API_URL,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function(response) {
                        $('#adicionarModal').modal('hide');
                        $.get(API_URL, renderTable);
                        $('#addForm')[0].reset();

                        // Exibe mensagem com o número do registro
                        if (response && response.numRSO) {
                            alert(`Registrado! Número do RSO ---- ${response.numRSO}`);
                        } else {
                            alert('Registro salvo com sucesso!');
                        }
                    }
                });
            });

            // aplicar máscara
            $('#addVtr').mask('A-0000', {
                translation: {
                    'A': { pattern: /[A-Za-z]/ }
                }
            });
            $('#editVtr').mask('A-0000', {
                translation: {
                    'A': { pattern: /[A-Za-z]/ }
                }
            });

            $('#addHrInicio, #editHrInicio').mask('00:00');

            // converter em maiusculo
            $('#addVtr, #editVtr').on('input', function() {
                let val = $(this).val();
                // Só altera a letra, mantém o traço e números
                if (val.length > 0) {
                    $(this).val(val.charAt(0).toUpperCase() + val.slice(1));
                }
            });


            // Editar Registro
            $(document).on('click', '#btnEditar', function() {
                const id = $(this).data('id');
                console.log(`id para edição ${id}`);
                $.get(`${API_URL}/${id}`, function(rso) {
                    $('#editId').val(rso._id);
                    $('#editNumRSO').val(rso.numRSO);
                    $('#editData').val(rso.data);
                    $('#editHrInicio').val(rso.hrInicio);            
                    $('#editNumPPRi').val(rso.numPPRi);
                    $('#editCgp').val(rso.cgp);
                    $('#editVtr').val(rso.vtr);
                    $('#editBop').val(rso.bop);
                    $('#editTpSvc').val(rso.tpSvc);
                    $('#editAux1').val(rso.aux1);
                    $('#editAux2').val(rso.aux2);
                    $('#editAux3').val(rso.aux3);
                    $('#editQtdFisc').val(rso.qtdFisc);
                    $('#editQtdAut').val(rso.qtdAut);
                    $('#editQtdBO').val(rso.qtdBO);
                    $('#editQtdARV').val(rso.qtdARV);
                    $('#editQtdARD').val(rso.qtdARD);
                    $('#editQtdImg').val(rso.qtdImg);
                    $('#editQtdTestes').val(rso.qtdTestes);
                    $('#editarModal').modal('show');
                });
            });


            //Salvar Edição
            $('#salvarEdicao').click(function() {
                const id = $('#editId').val();
                        console.log(`id salvo para edição linha 366 ${id}`);
                const data = {
                    numRSO: $('#editNumRSO').val(),
                    data: $('#editData').val(),
                    hrInicio: $('#editHrInicio').val(),            
                    numPPRi: $('#editNumPPRi').val(),
                    cgp: $('#editCgp').val(),
                    vtr: $('#editVtr').val(),
                    bop: $('#editBop').val(),
                    tpSvc: $('#editTpSvc').val(),
                    aux1: $('#editAux1').val(),
                    aux2: $('#editAux2').val(),
                    aux3: $('#editAux3').val(),
                    qtdFisc: $('#editQtdFisc').val(),
                    qtdAut: $('#editQtdAut').val(),
                    qtdBO: $('#editQtdBO').val(),
                    qtdARV: $('#editQtdARV').val(),
                    qtdARD: $('#editQtdARD').val(),
                    qtdImg: $('#editQtdImg').val(),
                    qtdTestes: $('#editQtdTestes').val()
                };
                    console.log('data salvo para edição linha 387', JSON.stringify(data, null, 2));
                $.ajax({
                    url: `${API_URL}/${id}`,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function() {
                        $('#editarModal').modal('hide');
                        $.get(API_URL, renderTable);
                    }
                });
            });
            

            // Exibir detalhes
            $(document).on('click', '.btn-details', function() {
                const id = $(this).data('id');
                $.get(`${API_URL}/${id}`, function(rso) {

                    let dataFormatada = '';
                    if (rso.data) {
                        const partes = rso.data.split('-');
                        if (partes.length === 3) {
                            dataFormatada = `${partes[2]}-${partes[1]}-${partes[0]}`;
                        } else {
                            dataFormatada = rso.data;
                        }
                    }

                    let html = `
                        <div class="mb-2"><strong style="color:#0d6efd;">ID:</strong> ${rso._id}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">RSO Num:</strong> ${rso.numRSO}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Data:</strong> ${dataFormatada}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Hora Inicio:</strong> ${rso.hrInicio}</div>                
                        <div class="mb-2"><strong style="color:#0d6efd;">PPRi Num:</strong> ${rso.numPPRi}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Viatura:</strong> ${rso.vtr}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">CGP:</strong> ${rso.cgp}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">BOp:</strong> ${rso.bop}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Serviço:</strong> ${rso.tpSvc}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Aux-1:</strong> ${rso.aux1}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Aux-2:</strong> ${rso.aux2}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Aux-3:</strong> ${rso.aux3}</div>
                        <hr>
                    `;

                    const camposSecundarios = [
                        'qtdFisc','qtdAut','qtdBO','qtdARV','qtdARD','qtdImg','qtdTestes', 'createdAt', 'updatedAt'
                    ];

                    const nomesCampos = {
                        qtdFisc: 'Quantidade de Fiscalizados',
                        qtdAut: 'Quantidade de Autuações',
                        qtdBO: 'Quantidade de BO',
                        qtdARV: 'Quantidade de ARV',
                        qtdARD: 'Quantidade de ARD',
                        qtdImg: 'Quantidade de Imagens',
                        qtdTestes: 'Quantidade de Testes',
                        createdAt: 'Data/Hora de Inclusão',
                        updatedAt: 'Data/Hora de Alteração'
                    };

                    camposSecundarios.forEach(campo => {
                        let valor = rso[campo] || '';
                        // Formata datas se necessário
                        if (campo === 'createdAt' || campo === 'updatedAt') {
                            valor = valor ? new Date(valor).toLocaleString('pt-BR') : '';
                        }
                        html += `<div class="mb-2"><strong>${nomesCampos[campo]}:</strong> ${valor}</div>`;
                    });
                    html += `
                        <div class="mt-3 text-end">
                            <button class="btn btn-warning" id="btnEditar" data-id="${rso._id}" data-bs-dismiss="modal">
                                <i class="bi bi-pencil"></i> Editar
                            </button>
                        </div>
                    `;
                    $('#detalhesModal .modal-body').html(html);
                });
            });

            // Excluir registro
            $(document).on('click', '.btn-delete', function() {
                const id = $(this).data('id');
                if (confirm('Tem certeza que deseja excluir este registro?')) {
                    $.ajax({
                        url: `${API_URL}/${id}`,
                        type: 'DELETE',
                        success: function() {
                            $.get(API_URL, renderTable);
                        }
                    });
                }
            });


        });
    </script>

</body>
</html>
