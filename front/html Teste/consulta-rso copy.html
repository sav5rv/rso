<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta RSO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
.card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 0.5rem 0.75rem; /* Reduz o padding do cabeçalho */
        }
        .card-body-sm {
            padding: 0.5rem 0.5rem !important; /* Classe para reduzir o padding do corpo */
        }
        .card-body-sm h4 {
            margin: 0; /* Remove a margem do título para economizar espaço */
            font-size: 1.25rem; /* Opcional: diminui um pouco o tamanho da fonte */
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
        .table-responsive {
            border-radius: 0.5rem;
            overflow: auto;
        }
        .btn-action {
            margin: 0 3px;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        /* Garantir que a tabela se adapte */
        #rsoTable th, #rsoTable td {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="navbarContainer"></div>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-search me-2"></i>Consulta de RSO</h2>
            </div>
            <div class="card-body p-4">
                <div class="d-flex mb-3 align-items-end">
                    <div class="me-2">
                        <label for="filtroBop" class="form-label">Filtrar por BOP:</label>
                        <select class="form-control" id="filtroBop">
                            <option value="">Todos</option>
                            <option value="127/2">127/2</option>
                            <option value="258/1">258/1</option>
                            <option value="258/2">258/2</option>
                            <option value="270/5">270/5</option>
                            <option value="270/6">270/6</option>
                        </select>
                    </div>

                    <div class="me-2">
                        <label for="filtroMes" class="form-label">Mês:</label>
                        <select class="form-control" id="filtroMes">
                            <option value="">Todos</option>
                            <option value="01">Janeiro</option>
                            <option value="02">Fevereiro</option>
                            <option value="03">Março</option>
                            <option value="04">Abril</option>
                            <option value="05">Maio</option>
                            <option value="06">Junho</option>
                            <option value="07">Julho</option>
                            <option value="08">Agosto</option>
                            <option value="09">Setembro</option>
                            <option value="10">Outubro</option>
                            <option value="11">Novembro</option>
                            <option value="12">Dezembro</option>
                        </select>
                    </div>                    
                    
                    <div class="me-2">
                        <label for="filtroCgp" class="form-label">CGP:</label>
                        <input type="text" class="form-control" id="filtroCgp" placeholder="Nome do CGP">
                    </div>
                    
                    <div class="me-2">
                        <label for="filtroHoraInicio" class="form-label">Hora Início:</label>
                        <input type="text" class="form-control" id="filtroHoraInicio" placeholder="Ex: 10:00">
                    </div>

                    <div class="me-2">
                        <label for="filtroServico" class="form-label">Serviço:</label>
                        <select class="form-control" id="filtroServico">
                                <option value="">Selecione</option>
                                <option value="ADM">ADM</option>
                                <option value="CGP">CGP</option>
                                <option value="CMT">CMT</option>
                                <option value="Dejem">Dejem</option>
                                <option value="Escala Extra">Escala Extra</option>
                                <option value="Guarda Quartel">Guarda Quartel</option>
                                <option value="OPERACIONAL">OPERACIONAL</option>
                                <option value="PDR">PDR</option>
                                <option value="Reforço Op">Reforço Op</option>
                                <option value="TOR">TOR</option>
                        </select>
                    </div>                    

                    <button id="btnFiltrar" class="btn btn-gradient">
                        <i class="bi bi-filter"></i> Filtrar
                    </button>
                </div>
                
                <div class="table-responsive">
                    <table id="rsoTable" class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>RSO Num</th>
                                <th>Data</th>
                                <th>Hora Início</th>
                                <th>PPRi</th>
                                <th>Viatura</th>
                                <th>CGP</th>
                                <th>BOP</th>
                                <th>Serviço</th>
                                <th>Auxiliar 1</th>
                                <th>Auxiliar 2</th>
                                <th>Auxiliar 3</th>
                                <th>Qtd Fisc</th>
                                <th>Qtd Aut</th>
                                <th>Qtd BO</th>
                                <th>Qtd ARV</th>
                                <th>Qtd ARD</th>
                                <th>Qtd Img</th>
                                <th>Qtd Testes</th>
                            </tr>
                        </thead>
                        <tbody id="rsoTableBody">
                            </tbody>
                    </table>
                </div>

                <div class="row mt-4 justify-content-center" id="resumoCalculado">
                    <div class="col-12 text-center mb-3">
                        <h4>Resumo da atividade</h4>
                    </div>
                    <div class="col-6 col-sm-4 col-md-auto text-center">
                        <div class="card">
                            <div class="card-header bg-primary text-white">Fiscalizações</div>
                            <div class="card-body card-body-sm"><h4 id="somaQtdFisc">0</h4></div>
                        </div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-auto text-center">
                        <div class="card">
                            <div class="card-header bg-success text-white">Autuações</div>
                            <div class="card-body card-body-sm"><h4 id="somaQtdAut">0</h4></div>
                        </div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-auto text-center">
                        <div class="card">
                            <div class="card-header bg-danger text-white">B.O.</div>
                            <div class="card-body card-body-sm"><h4 id="somaQtdBO">0</h4></div>
                        </div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-auto text-center">
                        <div class="card">
                            <div class="card-header bg-warning text-dark">A.R.V.</div>
                            <div class="card-body card-body-sm"><h4 id="somaQtdARV">0</h4></div>
                        </div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-auto text-center">
                        <div class="card">
                            <div class="card-header bg-info text-white">A.R.D.</div>
                            <div class="card-body card-body-sm"><h4 id="somaQtdARD">0</h4></div>
                        </div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-auto text-center">
                        <div class="card">
                            <div class="card-header bg-secondary text-white">Imagens</div>
                            <div class="card-body card-body-sm"><h4 id="somaQtdImg">0</h4></div>
                        </div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-auto text-center">
                        <div class="card">
                            <div class="card-header bg-dark text-white">Testes</div>
                            <div class="card-body card-body-sm"><h4 id="somaQtdTestes">0</h4></div>
                        </div>
                    </div>
                </div>


                <div class="row mt-4 justify-content-center">
                    <div class="col-12 text-center mb-3">
                        <h4>Viaturas mais Utilizadas</h4>
                    </div>
                    <div class="col-12 col-md-auto text-center">
                        <div class="row" id="resumoVtrs">
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    
    <script>
        const API_URL = 'http://localhost:3001/api/rso/buscar'; // Atualize para o endpoint correto
        let dataTable;

        // Carrega o conteúdo do navbar.html
        $(function(){
            $("#navbarContainer").load("navbar.html");
        });

        function renderTable(rsos) {
            if ($.fn.DataTable.isDataTable('#rsoTable')) {
                $('#rsoTable').DataTable().destroy();
            }
            const tbody = $('#rsoTableBody');
            tbody.empty();

            // Reinicia as somas
            let somaQtdFisc = 0;
            let somaQtdAut = 0;
            let somaQtdBO = 0;
            let somaQtdARV = 0;
            let somaQtdARD = 0;
            let somaQtdImg = 0;
            let somaQtdTestes = 0;
            const contagemVtrs = {}; // Objeto para contar as viaturas

            rsos.forEach(rso => {
                let dataFormatada = '';
                if (rso.data) {
                    const partes = rso.data.split('-');
                    if (partes.length === 3) {
                        dataFormatada = `${partes[2]}-${partes[1]}-${partes[0]}`;
                    } else {
                        dataFormatada = rso.data;
                    }
                }
                
                // Acumula os valores para o cálculo
                somaQtdFisc += parseInt(rso.qtdFisc || 0);
                somaQtdAut += parseInt(rso.qtdAut || 0);
                somaQtdBO += parseInt(rso.qtBO || 0);
                somaQtdARV += parseInt(rso.qtARV || 0);
                somaQtdARD += parseInt(rso.qtdARD || 0);
                somaQtdImg += parseInt(rso.qtdImg || 0);
                somaQtdTestes += parseInt(rso.qtdTestes || 0);
                
                // Contagem das viaturas
                const vtr = rso.vtr || 'Não Informado';
                contagemVtrs[vtr] = (contagemVtrs[vtr] || 0) + 1;

                tbody.append(`
                    <tr>
                        <td>${rso.numRSO || ''}</td>
                        <td>${dataFormatada || ''}</td>
                        <td>${rso.hrInicio || ''}</td>
                        <td>${rso.numPPRi || ''}</td>
                        <td>${rso.vtr || ''}</td>
                        <td>${rso.cgp || ''}</td>
                        <td>${rso.bop || ''}</td>
                        <td>${rso.tpSvc || ''}</td>
                        <td>${rso.aux1 || ''}</td>
                        <td>${rso.aux2 || ''}</td>
                        <td>${rso.aux3 || ''}</td>
                        <td>${rso.qtdFisc || ''}</td>
                        <td>${rso.qtdAut || ''}</td>
                        <td>${rso.qtdBO || ''}</td>
                        <td>${rso.qtdARV || ''}</td>
                        <td>${rso.qtdARD || ''}</td>
                        <td>${rso.qtdImg || ''}</td>
                        <td>${rso.qtdTestes || ''}</td>
                    </tr>
                `);
            });

            // Exibe os totais calculados
            $('#somaQtdFisc').text(somaQtdFisc);
            $('#somaQtdAut').text(somaQtdAut);
            $('#somaQtdBO').text(somaQtdBO);
            $('#somaQtdARV').text(somaQtdARV);
            $('#somaQtdARD').text(somaQtdARD);
            $('#somaQtdImg').text(somaQtdImg);
            $('#somaQtdTestes').text(somaQtdTestes);

            // --- Nova Lógica para as 6 Viaturas mais Usadas ---
            const vtrsOrdenadas = Object.entries(contagemVtrs).sort((a, b) => b[1] - a[1]);
            const topVtrs = vtrsOrdenadas.slice(0, 6);
            const cores = ['bg-primary', 'bg-success', 'bg-info', 'bg-warning', 'bg-danger', 'bg-secondary'];
            let htmlVtrs = '';
            
            // Se não houver viaturas, exibe uma mensagem
            if (topVtrs.length === 0) {
                htmlVtrs = '<div class="col-12 text-center text-muted">Nenhuma VTR encontrada para os filtros.</div>';
            } else {
                topVtrs.forEach(([vtr, count], index) => {
                    const cor = cores[index % cores.length];
                    htmlVtrs += `
                        <div class="col-6 col-sm-4 col-md-auto text-center mb-2">
                            <div class="card">
                                <div class="card-header ${cor} text-white">${vtr}</div>
                                <div class="card-body card-body-sm">
                                    <h4>${count}</h4>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            $('#resumoVtrs').html(htmlVtrs);

            // Inicializa a DataTable
            dataTable = $('#rsoTable').DataTable({
                language: {
                    url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json"
                    //url: "pt-BR.json" //caminho local
                },
                destroy: true,
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'excelHtml5',
                        text: '<i class="bi bi-file-earmark-excel"></i> Exportar XLSX',
                        className: 'btn btn-success'
                    },
                    {
                        extend: 'pdfHtml5',
                        text: '<i class="bi bi-file-earmark-pdf"></i> Exportar PDF',
                        className: 'btn btn-danger'
                    },
                    {
                        extend: 'print',
                        text: '<i class="bi bi-printer"></i> Imprimir',
                        className: 'btn btn-secondary'
                    }
                ]
            });
        }


        // Event listener para o botão de filtrar
        $('#btnFiltrar').on('click', function() {
            const filtroBop = $('#filtroBop').val();
            const filtroCgp = $('#filtroCgp').val();
            const filtroHoraInicio = $('#filtroHoraInicio').val();
            const filtroServico = $('#filtroServico').val();
            const filtroMes = $('#filtroMes').val();

            // Cria um objeto de parâmetros de consulta
            const params = {};
            if (filtroBop !== '') {
                params.bop = filtroBop;
            }
            if (filtroMes !== '') {
                params.mes = filtroMes;
            }            
            if (filtroCgp !== '') {
                params.cgp = filtroCgp;
            }
            if (filtroHoraInicio !== '') {
                params.hrInicio = filtroHoraInicio;
            }
            if (filtroServico !== '') {
                params.tpSvc = filtroServico;
            }
            
            // Converte o objeto de parâmetros para uma string de URL (Ex: "bop=270%2F5&cgp=Fulano")
            const queryString = $.param(params);
            const url = `${API_URL}?${queryString}`;

            // AQUI ESTÁ O CONSOLE.LOG PARA VOCÊ VER A URL GERADA
            console.log('URL da requisição:', url);

            // Faz a requisição com a nova URL
            $.get(url, renderTable);
        });
    </script>
</body>
</html>
