<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo CGP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 0.75rem 1.25rem;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
        .tree-node {
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 5px;
            font-weight: bold;
            display: block;
            background-color: #e9ecef;
            transition: background-color 0.2s;
        }
        .tree-node:hover {
            background-color: #cfd7e0;
        }
        .tree-node.expanded i.bi-caret-right-fill {
            transform: rotate(90deg);
        }
        .node-content {
            margin-left: 20px;
            padding-left: 10px;
            border-left: 2px solid #ccc;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-shield-check"></i> Sistema</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cadastro.html"><i class="bi bi-person-plus"></i> Cadastro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="rso.html"><i class="bi bi-table"></i> RSO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="consulta-rso.html"><i class="bi bi-search"></i> Consulta</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="bi bi-graph-up"></i> Resumo</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-graph-up me-2"></i>Resumo CGP</h2>
            </div>
            <div class="card-body p-4">
                <div class="d-flex mb-3 align-items-end">
                    <div class="me-2">
                        <label for="filtroMes" class="form-label">Filtrar por Mês:</label>
                        <select class="form-control" id="filtroMes">
                            <option value="">Todos</option>
                            <option value="01">Janeiro</option>
                            <option value="02">Fevereiro</option>
                            <option value="03">Março</option>
                            <option value="04">Abril</option>
                            <option value="05">Maio</option>
                            <option value="06">Junho</option>
                            <option value="07">Julho</option>
                            <option value="08">Agosto</option>
                            <option value="09">Setembro</option>
                            <option value="10">Outubro</option>
                            <option value="11">Novembro</option>
                            <option value="12">Dezembro</option>
                        </select>
                    </div>
                    <button id="btnFiltrar" class="btn btn-primary">
                        <i class="bi bi-filter"></i> Filtrar
                    </button>
                </div>
                
                <div id="treeContainer">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3001/api/rso/buscar';

        const camposQtd = ['qtdFisc', 'qtdAut', 'qtBO', 'qtARV', 'qtdARD', 'qtdImg', 'qtdTestes'];

        $('#btnFiltrar').on('click', function() {
            const filtroMes = $('#filtroMes').val();
            const params = {};
            if (filtroMes !== '') {
                params.mes = filtroMes;
            }
            const queryString = $.param(params);
            const url = `${API_URL}?${queryString}`;
            console.log('URL da requisição:', url);
            
            $.get(url, buildTree);
        });

        $(document).ready(function() {
            $.get(API_URL, buildTree);
        });
        
        function getPeriodo(hora) {
            const [horas, minutos] = hora.split(':').map(Number);
            const totalMinutos = horas * 60 + minutos;

            if (totalMinutos >= 360 && totalMinutos <= 720) return 'Manhã (06:00 - 12:00)';
            if (totalMinutos > 720 && totalMinutos <= 1080) return 'Tarde (12:01 - 18:00)';
            if (totalMinutos > 1080 && totalMinutos <= 1440) return 'Noite (18:01 - 00:00)';
            return 'Madrugada (00:01 - 05:59)';
        }
        
        function buildTree(rsos) {
            const treeData = {};
        
            rsos.forEach(rso => {
                const periodo = getPeriodo(rso.hrInicio);
                const bop = rso.bop || 'BOP Não Informado';
                const servico = rso.tpSvc || 'Serviço Não Informado';
                const cgp = rso.encEq || 'CGP Não Informado';
                const vtr = rso.vtr || 'VTR Não Informada';
                const auxiliar = rso.aux1 || 'Auxiliar Não Informado';
        
                // Cria a estrutura da árvore
                if (!treeData[periodo]) treeData[periodo] = {};
                if (!treeData[periodo][bop]) treeData[periodo][bop] = {};
                if (!treeData[periodo][bop][servico]) treeData[periodo][bop][servico] = {};
                if (!treeData[periodo][bop][servico][cgp]) treeData[periodo][bop][servico][cgp] = {};
                if (!treeData[periodo][bop][servico][cgp][vtr]) treeData[periodo][bop][servico][cgp][vtr] = {};
                if (!treeData[periodo][bop][servico][cgp][vtr][auxiliar]) {
                    treeData[periodo][bop][servico][cgp][vtr][auxiliar] = {};
                }
        
                // Soma os campos QTD
                camposQtd.forEach(campo => {
                    treeData[periodo][bop][servico][cgp][vtr][auxiliar][campo] = (treeData[periodo][bop][servico][cgp][vtr][auxiliar][campo] || 0) + (rso[campo] || 0);
                });
            });
        
            renderTree(treeData, $('#treeContainer'));
        }
        
        function renderTree(data, parentElement, level = 0) {
            parentElement.empty(); // Limpa o container
            const ul = $('<ul>').css({ 'list-style': 'none', 'padding-left': 0 });
            for (const key in data) {
                const item = data[key];
                const li = $('<li>');
                const hasChildren = Object.keys(item).length > 0 && !camposQtd.some(campo => key.startsWith(campo));
        
                let nodeHtml = `<div class="tree-node"><i class="bi bi-caret-right-fill"></i> ${key}</div>`;
                if (!hasChildren) {
                    nodeHtml = `<div class="tree-node-leaf">${key}</div>`;
                }
        
                const nodeDiv = $(nodeHtml);
                li.append(nodeDiv);
        
                if (hasChildren) {
                    const contentDiv = $('<div>').addClass('node-content').hide();
                    li.append(contentDiv);
                    renderTree(item, contentDiv, level + 1);
        
                    nodeDiv.on('click', function() {
                        $(this).toggleClass('expanded');
                        contentDiv.slideToggle(200);
                    });
                }
        
                // Se o nó for um auxiliar, exibe os campos QTD abaixo
                if (level === 5) {
                    const fieldsHtml = camposQtd.map(campo => {
                        const nomeCampo = campo.replace('qtd', 'Qtd ').replace('qt', 'Qtd ').replace(/([A-Z])/g, ' $1').trim();
                        return `<div><small><strong>${nomeCampo}:</strong> ${item[campo] || 0}</small></div>`;
                    }).join('');
                    li.append($('<div class="node-content">').html(fieldsHtml));
                }
        
                ul.append(li);
            }
            parentElement.append(ul);
        }
    </script>
</body>
</html>
