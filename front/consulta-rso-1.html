<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta RSO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
        .table-responsive {
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .btn-action {
            margin: 0 3px;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        /* Oculta as colunas de exportação para que não poluam a visualização */
        .export-only {
            display: none !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-shield-check"></i> Sistema
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cadastro.html"><i class="bi bi-person-plus"></i> Cadastro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="rso.html"><i class="bi bi-table"></i> RSO</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-search me-2"></i>Consulta de RSO</h2>
            </div>
            <div class="card-body p-4">
                <div class="d-flex mb-3 align-items-end">
                    <div class="me-2">
                        <label for="filtroBop" class="form-label">Filtrar por BOP:</label>
                        <select class="form-control" id="filtroBop">
                            <option value="">Todos</option>
                            <option value="270/5">127/2</option>
                            <option value="270/5">258/1</option>
                            <option value="270/5">258/2</option>
                            <option value="270/5">270/5</option>
                            <option value="270/6">270/6</option>
                        </select>
                    </div>
                    <button id="btnFiltrar" class="btn btn-gradient">
                        <i class="bi bi-filter"></i> Filtrar
                    </button>
                </div>
                
                <div class="table-responsive">
                    <table id="rsoTable" class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>RSO Num</th>
                                <th>Data</th>
                                <th>PPRi</th>
                                <th>Viatura</th>
                                <th>Encarregado</th>
                                <th>BOp</th>
                                <th>Ações</th>
                                <th class="export-only">Hora Início</th>
                                <th class="export-only">Serviço</th>
                                <th class="export-only">Aux-1</th>
                                <th class="export-only">Aux-2</th>
                                <th class="export-only">Aux-3</th>
                                <th class="export-only">Qtd Fisc</th>
                                <th class="export-only">Qtd Aut</th>
                                <th class="export-only">Qt BO</th>
                                <th class="export-only">Qt ARV</th>
                                <th class="export-only">Qtd ARD</th>
                                <th class="export-only">Qtd Img</th>
                                <th class="export-only">Qtd Testes</th>
                            </tr>
                        </thead>
                        <tbody id="rsoTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="detalhesModal" tabindex="-1" aria-labelledby="detalhesModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detalhesModalLabel">Detalhes do Registro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editarModalLabel">Editar Registro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3"><label for="editData" class="form-label">Data</label><input type="date" class="form-control" id="editData" required></div>
                        <div class="mb-3"><label for="editHrInicio" class="form-label">Hora Início</label><input type="text" class="form-control" id="editHrInicio"></div>                        
                        <div class="mb-3"><label for="editNumPPRi" class="form-label">numPPRi</label><input type="text" class="form-control" id="editNumPPRi"></div>
                        <div class="mb-3"><label for="editEncEq" class="form-label">Encarregado</label><input type="text" class="form-control" id="editEncEq"></div>
                        <div class="mb-3">
                            <label for="editVtr" class="form-label">VTR</label>
                            <input type="text" class="form-control" id="editVtr" placeholder="B-1234">
                            <small class="form-text text-muted">Formato: B-1234</small>
                        </div>
                        <div class="mb-3">
                            <label for="editBop" class="form-label">BOP</label>
                            <select class="form-control" id="editBop">
                                <option value="">Selecione</option>
                                <option value="270/5">127/2</option>
                                <option value="270/5">258/1</option>
                                <option value="270/5">258/2</option>
                                <option value="270/5">270/5</option>
                                <option value="270/6">270/6</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editTpSvc" class="form-label">Tipo Serviço</label>
                            <select class="form-control" id="editTpSvc">
                                <option value="">Selecione</option>
                                <option value="Patrulha">Patrulha</option>
                                <option value="Dejem">Dejem</option>
                                <option value="TOR">TOR</option>
                                <option value="BOp">BOp</option>
                                <option value="E.Extra">E.Extra</option>
                            </select>
                        </div>
                        <div class="mb-3"><label for="editAux1" class="form-label">Aux1</label><input type="text" class="form-control" id="editAux1"></div>
                        <div class="mb-3"><label for="editAux2" class="form-label">Aux2</label><input type="text" class="form-control" id="editAux2"></div>
                        <div class="mb-3"><label for="editAux3" class="form-label">Aux3</label><input type="text" class="form-control" id="editAux3"></div>
                        <div class="mb-3"><label for="editQtdFisc" class="form-label">Qtd Fisc</label><input type="number" class="form-control" id="editQtdFisc"></div>
                        <div class="mb-3"><label for="editQtdAut" class="form-label">Qtd Aut</label><input type="number" class="form-control" id="editQtdAut"></div>
                        <div class="mb-3"><label for="editQtBO" class="form-label">Qt BO</label><input type="number" class="form-control" id="editQtBO"></div>
                        <div class="mb-3"><label for="editQtARV" class="form-label">Qt ARV</label><input type="number" class="form-control" id="editQtARV"></div>
                        <div class="mb-3"><label for="editQtdARD" class="form-label">Qtd ARD</label><input type="number" class="form-control" id="editQtdARD"></div>
                        <div class="mb-3"><label for="editQtdImg" class="form-label">Qtd Img</label><input type="number" class="form-control" id="editQtdImg"></div>
                        <div class="mb-3"><label for="editQtdTestes" class="form-label">Qtd Testes</label><input type="number" class="form-control" id="editQtdTestes"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="salvarEdicao">Salvar</button>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="adicionarModal" tabindex="-1" aria-labelledby="adicionarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adicionarModalLabel">Registrar R.S.O.</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3"><label for="addData" class="form-label">Data</label><input type="date" class="form-control" id="addData" required></div>
                        <div class="mb-3"><label for="addHrInicio" class="form-label">Hora Início</label><input type="text" class="form-control" id="addHrInicio"></div>                        
                        <div class="mb-3"><label for="addNumPPRi" class="form-label">Número do PPRi</label><input type="number" class="form-control" id="addNumPPRi"></div>
                        <div class="mb-3"><label for="addEncEq" class="form-label">Encarregado</label><input type="text" class="form-control" id="addEncEq"></div>
                        <div class="mb-3">
                            <label for="addVtr" class="form-label">Viatura</label>
                            <input type="text" class="form-control" id="addVtr" placeholder="B-1234">
                            </div>
                        <div class="mb-3">
                            <label for="addBop" class="form-label">Base Operacional</label>
                            <select class="form-control" id="addBop">
                                <option value="">Selecione</option>
                                <option value="270/5">127/2</option>
                                <option value="270/5">258/1</option>
                                <option value="270/5">258/2</option>
                                <option value="270/5">270/5</option>
                                <option value="270/6">270/6</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="addTpSvc" class="form-label">Tipo Serviço</label>
                            <select class="form-control" id="addTpSvc">
                                <option value="">Selecione</option>
                                <option value="Patrulha">Patrulha</option>
                                <option value="Dejem">Dejem</option>
                                <option value="TOR">TOR</option>
                                <option value="BOp">BOp</option>
                                <option value="E.Extra">E.Extra</option>
                            </select>
                        </div>                        
                        <div class="mb-3"><label for="addAux1" class="form-label">Auxiliar 1</label><input type="text" class="form-control" id="addAux1"></div>
                        <div class="mb-3"><label for="addAux2" class="form-label">Auxiliar 2</label><input type="text" class="form-control" id="addAux2"></div>
                        <div class="mb-3"><label for="addAux3" class="form-label">Auxiliar 3</label><input type="text" class="form-control" id="addAux3"></div>
                        </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="salvarAdicionar">Salvar</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    
    <script>
        const API_URL = 'http://localhost:3001/api/rso'; 
        let dataTable;

        function renderTable(rsos) {
            if ($.fn.DataTable.isDataTable('#rsoTable')) {
                $('#rsoTable').DataTable().destroy();
            }
            const tbody = $('#rsoTableBody');
            tbody.empty();
            rsos.forEach(rso => {
                let dataFormatada = '';
                if (rso.data) {
                    const partes = rso.data.split('-');
                    if (partes.length === 3) {
                        dataFormatada = `${partes[2]}-${partes[1]}-${partes[0]}`;
                    } else {
                        dataFormatada = rso.data;
                    }
                }
                tbody.append(`
                    <tr>
                        <td>${rso.numRSO || ''}</td>
                        <td>${dataFormatada || ''}</td>
                        <td>${rso.numPPRi || ''}</td>
                        <td>${rso.vtr || ''}</td>
                        <td>${rso.encEq || ''}</td>
                        <td>${rso.bop || ''}</td>
                        <td>
                            <button class="btn btn-info btn-action btn-details" data-id="${rso._id}" data-bs-toggle="modal" data-bs-target="#detalhesModal">
                                <i class="bi bi-eye"></i>
                            </button>
                        </td>
                        <td class="export-only">${rso.hrInicio || ''}</td>
                        <td class="export-only">${rso.tpSvc || ''}</td>
                        <td class="export-only">${rso.aux1 || ''}</td>
                        <td class="export-only">${rso.aux2 || ''}</td>
                        <td class="export-only">${rso.aux3 || ''}</td>
                        <td class="export-only">${rso.qtdFisc || ''}</td>
                        <td class="export-only">${rso.qtdAut || ''}</td>
                        <td class="export-only">${rso.qtBO || ''}</td>
                        <td class="export-only">${rso.qtARV || ''}</td>
                        <td class="export-only">${rso.qtdARD || ''}</td>
                        <td class="export-only">${rso.qtdImg || ''}</td>
                        <td class="export-only">${rso.qtdTestes || ''}</td>
                    </tr>
                `);
            });

            dataTable = $('#rsoTable').DataTable({
                language: {
                    url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json"
                },
                destroy: true,
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'excelHtml5',
                        text: '<i class="bi bi-file-earmark-excel"></i> Exportar XLSX',
                        className: 'btn btn-success'
                    },
                    {
                        extend: 'pdfHtml5',
                        text: '<i class="bi bi-file-earmark-pdf"></i> Exportar PDF',
                        className: 'btn btn-danger'
                    },
                    {
                        extend: 'print',
                        text: '<i class="bi bi-printer"></i> Imprimir',
                        className: 'btn btn-secondary'
                    }
                ]
            });
        }

        // Event listener para o botão de filtrar
        $('#btnFiltrar').on('click', function() {
            const filtro = $('#filtroBop').val();
            // Codifica a URL para garantir que caracteres especiais funcionem
            const filtroCodificado = encodeURIComponent(filtro);
            const url = filtroCodificado ? `${API_URL}/bop/${filtroCodificado}` : API_URL;
            $.get(url, renderTable);
        });

        // Carregar todos os registros ao iniciar a página
        $(document).ready(function() {
            $.get(API_URL, renderTable);
        });

        // O restante das funções (editar, excluir, detalhes, máscaras)
        // pode ser copiado do seu arquivo rso.html original,
        // pois a API para essas ações não será alterada.
        // Copie e cole aqui
    </script>

</body>
</html>
