<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
    </style>
</head>
<body>
    <div id="navbarContainer"></div>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-bookmark-plus"></i>Registrar Movimentação para o pátio DER</h2>
            </div>
            <div class="card-body p-4">

                <div class="d-flex flex-column flex-md-row justify-content-between mb-3">
                    <button class="btn btn-gradient me-2 mb-2 mb-md-0" data-bs-toggle="modal" data-bs-target="#adicionarModal">
                        <i class="bi bi-plus-circle"></i> Adicionar Registro
                    </button>
                    <div class="d-flex justify-content-start">
                        <button class="btn btn-success me-2" id="exportXLSXBtn">
                            <i class="bi bi-file-earmark-excel"></i> Exportar XLSX
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="adicionarModal" tabindex="-1" aria-labelledby="adicionarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adicionarModalLabel">Registrar RSO: <span id="rsoNumModal"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3"><label for="addData" class="form-label">Data</label><input type="date" class="form-control" id="addData" required></div>
                        <div class="mb-3"><label for="addHrInicio" class="form-label">Hora Início</label><input type="text" class="form-control" id="addHrInicio"></div>                        
                        <div class="mb-3"><label for="addNumPPRi" class="form-label">Número do PPRi</label><input type="number" class="form-control" id="addNumPPRi"></div>
                        <div class="mb-3"><label for="addCgp" class="form-label">CGP</label><input type="text" class="form-control" id="addCgp"></div>
                        <div class="mb-3">
                            <label for="addVtr" class="form-label">Viatura</label>
                            <input type="text" class="form-control" id="addVtr" placeholder="B-01234">
                            </div>
                        <div class="mb-3">
                            <label for="addBop" class="form-label">Base Operacional</label>
                            <select class="form-control" id="addBop">
                                <option value="">Selecione</option>
                                <option value="127/2">127/2</option>
                                <option value="258/1">258/1</option>
                                <option value="258/2">258/2</option>
                                <option value="270/5">270/5</option>
                                <option value="270/6">270/6</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="addTpSvc" class="form-label">Tipo Serviço</label>
                            <select class="form-control" id="addTpSvc">
                                <option value="">Selecione</option>
                                <option value="ADM">ADM</option>
                                <option value="CGP">CGP</option>
                                <option value="CMT">CMT</option>
                                <option value="Dejem">Dejem</option>
                                <option value="Escala Extra">Escala Extra</option>
                                <option value="Guarda Quartel">Guarda Quartel</option>
                                <option value="OPERACIONAL">OPERACIONAL</option>
                                <option value="PDR">PDR</option>
                                <option value="Reforço Op">Reforço Op</option>
                                <option value="TOR">TOR</option>
                            </select>
                        </div>                        
                        <div class="mb-3"><label for="addAux1" class="form-label">Auxiliar 1</label><input type="text" class="form-control" id="addAux1"></div>
                        <div class="mb-3"><label for="addAux2" class="form-label">Auxiliar 2</label><input type="text" class="form-control" id="addAux2"></div>
                        <div class="mb-3"><label for="addAux3" class="form-label">Auxiliar 3</label><input type="text" class="form-control" id="addAux3"></div>
                        </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="salvarAdicionar">Salvar</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3001/api/rso';

        function fetchLastRSO() {
            const lastRsoInfo = $('#lastRsoInfo');
            lastRsoInfo.show();
            
            $.get(API_URL, function(rsos) {
                if (rsos.length > 0) {
                    // Ordena os dados por numRSO em ordem decrescente
                    rsos.sort((a, b) => b.numRSO - a.numRSO);
                    const lastRSO = rsos[0];
                    const createdAt = new Date(lastRSO.createdAt).toLocaleString('pt-BR');
                    lastRsoInfo.html(`Último RSO cadastrado: <strong>${lastRSO.numRSO}</strong> em ${createdAt} para a Vtr ${lastRSO.vtr} na BOp ${lastRSO.bop}.`);
                    $('#rsoNumModal').text(lastRSO.numRSO + 1); // Atualiza o número do RSO no cabeçalho do modal
                } else {
                    lastRsoInfo.html('Nenhum registro encontrado.');
                }
            }).fail(function() {
                lastRsoInfo.html('Erro ao carregar o último RSO.');
            });
        }

        function getFormData() {
            return {
                data: $('#addData').val(),
                numPPRi: $('#addNumPPRi').val(),
                cgp: $('#addCgp').val(),
                vtr: $('#addVtr').val(),
                bop: $('#addBop').val(),
                tpSvc: $('#addTpSvc').val(),
                aux1: $('#addAux1').val(),
                aux2: $('#addAux2').val(),
                aux3: $('#addAux3').val(),
                hrInicio: $('#addHrInicio').val(),
                qtdFisc: $('#addQtdFisc').val(),
                qtdAut: $('#addQtdAut').val(),
                qtdBO: $('#addQtdBO').val(),
                qtdARV: $('#addQtdARV').val(),
                qtdARD: $('#addQtdARD').val(),
                qtdImg: $('#addQtdImg').val(),
                qtdTestes: $('#addQtdTestes').val()
            };
        }

        $(document).ready(function() {
            $("#navbarContainer").load("navbar.html");
            fetchLastRSO(); // Busca e exibe o último RSO ao carregar a página

            // Lógica para salvar novo registro
            $('#salvarAdicionar').click(function() {
                const data = getFormData();
                $.ajax({
                    url: API_URL,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function(response) {
                        $('#adicionarModal').modal('hide');
                        $('#addForm')[0].reset();
                        if (response && response.numRSO && response.vtr) {
                            alert(`RSO número ${response.numRSO} cadastrado na vtr ${response.vtr}`);
                        } else {
                            alert('Registro salvo com sucesso!');
                        }
                        fetchLastRSO(); // Atualiza a mensagem do último RSO
                    },
                    error: function(xhr, status, error) {
                        console.error('Erro ao salvar registro:', error);
                        alert('Ocorreu um erro ao salvar o registro. Tente novamente.');
                    }
                });
            });

            // Lógica para exportar para XLSX
            $('#exportXLSXBtn').on('click', function() {
                $.get(API_URL, function(rsos) {
                    const dataToExport = rsos.map(rso => ({
                        'Num RSO': rso.numRSO,
                        'Data': rso.data,
                        'PPRi': rso.numPPRi,
                        'Viatura': rso.vtr,
                        'CGP': rso.cgp,
                        'BOp': rso.bop,
                        'Hora Início': rso.hrInicio,
                        'Serviço': rso.tpSvc,
                        'Aux-1': rso.aux1,
                        'Aux-2': rso.aux2,
                        'Aux-3': rso.aux3,
                        'Qtd Fisc': rso.qtdFisc,
                        'Qtd Aut': rso.qtdAut,
                        'Qtd BO': rso.qtdBO,
                        'Qtd ARV': rso.qtdARV,
                        'Qtd ARD': rso.qtdARD,
                        'Qtd Img': rso.qtdImg,
                        'Qtd Testes': rso.qtdTestes,
                    }));

                    const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Registros RSO");
                    XLSX.writeFile(workbook, "registros_rso.xlsx");
                });
            });

            // Lógicas de máscara e maiúsculas
            $('#addVtr').mask('A-00000', { translation: { 'A': { pattern: /[A-Za-z]/ } } });
            $('#addHrInicio').mask('00:00');
            $('#addVtr').on('input', function() {
                let val = $(this).val();
                if (val.length > 0) {
                    $(this).val(val.charAt(0).toUpperCase() + val.slice(1));
                }
            });
        });
    </script>
</body>
</html>
