<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
        .table-responsive {
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .btn-action {
            margin: 0 3px;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #loadingMessage {
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            color: #6c757d;
        }
        .sticky-table-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #fff; /* Adicionado para que o fundo não seja transparente */
        }
    </style>
</head>
<body>
    <div id="navbarContainer"></div>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-table me-2"></i>Lista de RSO registrado</h2>
            </div>
            <div class="card-body p-4">
                
                <div id="loadingMessage" class="d-none">Carregando...</div>
                
                <div class="table-responsive">
                    <table id="rsoTable" class="table table-striped table-hover">
                        <thead class="sticky-table-header">
                            <tr>
                                <th>RSO Num</th>
                                <th>Data</th>
                                <th>PPRi</th>
                                <th>Viatura</th>
                                <th>CGP</th>
                                <th>BOp</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="detalhesModal" tabindex="-1" aria-labelledby="detalhesModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detalhesModalLabel">Detalhes do Registro: <span id="rsoNumModal"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editarModalLabel">Editar Registro: <span id="rsoNumModalEdit"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3"><label for="editData" class="form-label">Data</label><input type="date" class="form-control" id="editData" required></div>
                        <div class="mb-3"><label for="editHrInicio" class="form-label">Hora Início</label><input type="text" class="form-control" id="editHrInicio"></div>                        
                        <div class="mb-3"><label for="editNumPPRi" class="form-label">Número do PPRi</label><input type="text" class="form-control" id="editNumPPRi"></div>
                        <div class="mb-3"><label for="editCgp" class="form-label">CGP</label><input type="text" class="form-control" id="editCgp"></div>
                        <div class="mb-3"><label for="editVtr" class="form-label">Viatura</label><input type="text" class="form-control" id="editVtr" placeholder="B-01234"></div>
                        <div class="mb-3">
                            <label for="editBop" class="form-label">BOP</label>
                            <select class="form-control" id="editBop">
                                <option value="">Selecione</option>
                                <option value="127/2">127/2</option>
                                <option value="258/1">258/1</option>
                                <option value="258/2">258/2</option>
                                <option value="270/5">270/5</option>
                                <option value="270/6">270/6</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editTpSvc" class="form-label">Tipo Serviço</label>
                            <select class="form-control" id="editTpSvc">
                                <option value="">Selecione</option>
                                <option value="ADM">ADM</option>
                                <option value="CGP">CGP</option>
                                <option value="CMT">CMT</option>
                                <option value="Dejem">Dejem</option>
                                <option value="Escala Extra">Escala Extra</option>
                                <option value="Guarda Quartel">Guarda Quartel</option>
                                <option value="OPERACIONAL">OPERACIONAL</option>
                                <option value="PDR">PDR</option>
                                <option value="Reforço Op">Reforço Op</option>
                                <option value="TOR">TOR</option>
                            </select>
                        </div>
                        <div class="mb-3"><label for="editEnc" class="form-label">Encarregado</label><input type="text" class="form-control" id="editEnc"></div>
                        <div class="mb-3"><label for="editAux1" class="form-label">Aux1</label><input type="text" class="form-control" id="editAux1"></div>
                        <div class="mb-3"><label for="editAux2" class="form-label">Aux2</label><input type="text" class="form-control" id="editAux2"></div>
                        <div class="mb-3"><label for="editAux3" class="form-label">Aux3</label><input type="text" class="form-control" id="editAux3"></div>
                        <div class="mb-3"><label for="editObs" class="form-label">Observações</label><input type="text" class="form-control" id="editObs"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="salvarEdicao">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3001/api/rso';

        function renderTable(rsos) {
            const tableBody = $('#rsoTable tbody');
            tableBody.empty();
            $('#loadingMessage').addClass('d-none');
            $('.table-responsive').removeClass('d-none');

            if (rsos.length === 0) {
                tableBody.append('<tr><td colspan="7" class="text-center">Nenhum registro encontrado.</td></tr>');
                return;
            }

            rsos.sort((a, b) => b.numRSO - a.numRSO);
            
            rsos.forEach(rso => {
                const dataFormatada = rso.data ? rso.data.split('-').reverse().join('-') : '';
                const newRow = `
                    <tr>
                        <td>${rso.numRSO || ''}</td>
                        <td>${dataFormatada || ''}</td>
                        <td>${rso.numPPRi || ''}</td>
                        <td>${rso.vtr || ''}</td>
                        <td>${rso.cgp || ''}</td>
                        <td>${rso.bop || ''}</td>
                        <td class="text-center">
                            <button class="btn btn-info btn-action btn-details" data-id="${rso._id}" data-bs-toggle="modal" data-bs-target="#detalhesModal">
                                <i class="bi bi-eye"></i>
                            </button>

                        </td>
                    </tr>
                `;
                tableBody.append(newRow);
            });
        }

        function fetchAndRenderData() {
            $('#loadingMessage').removeClass('d-none');
            $('.table-responsive').addClass('d-none');
            
            $.get(API_URL, function(rsos) {
                renderTable(rsos);
            }).fail(function() {
                $('#loadingMessage').text('Erro ao carregar dados. Tente novamente.');
            });
        }

        function getFormData() {
            return {
                data: $('#addData').val(),
                hrInicio: $('#addHrInicio').val(),               
                numPPRi: $('#addNumPPRi').val(),
                cgp: $('#addCgp').val(),
                vtr: $('#addVtr').val(),
                bop: $('#addBop').val(),
                tpSvc: $('#addTpSvc').val(),
                enc: $('#addEnc').val(),
                aux1: $('#addAux1').val(),
                aux2: $('#addAux2').val(),
                aux3: $('#addAux3').val(),
                obs: $('#addObs').val()

            };
        }

        $(document).ready(function() {
            fetchAndRenderData();
            $("#navbarContainer").load("rso/navbar.html");

            // $('#salvarAdicionar').click(function() {
            //     const data = getFormData();
            //     $.ajax({
            //         url: API_URL,
            //         type: 'POST',
            //         contentType: 'application/json',
            //         data: JSON.stringify(data),
            //         success: function(response) {
            //             $('#adicionarModal').modal('hide');
            //             fetchAndRenderData();
            //             $('#addForm')[0].reset();
            //             if (response && response.numRSO) {
            //                 alert(`Registrado! Número do RSO ---- ${response.numRSO}`);
            //             } else {
            //                 alert('Registro salvo com sucesso!');
            //             }
            //         }
            //     });
            // });

            $('#salvarEdicao').click(function() {
                const id = $('#editId').val();
                const data = {
                    data: $('#editData').val(),
                    hrInicio: $('#editHrInicio').val(),            
                    numPPRi: $('#editNumPPRi').val(),
                    cgp: $('#editCgp').val(),
                    vtr: $('#editVtr').val(),
                    bop: $('#editBop').val(),
                    tpSvc: $('#editTpSvc').val(),
                    enc: $('#editEnc').val(),
                    aux1: $('#editAux1').val(),
                    aux2: $('#editAux2').val(),
                    aux3: $('#editAux3').val(),
                    obs: $('#editObs').val()

                };
                $.ajax({
                    url: `${API_URL}/${id}`,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function() {
                        $('#editarModal').modal('hide');
                        fetchAndRenderData();
                    }
                });
            });

            $(document).on('click', '.btn-delete', function() {
                const id = $(this).data('id');
                if (confirm('Tem certeza que deseja excluir este registro?')) {
                    $.ajax({
                        url: `${API_URL}/${id}`,
                        type: 'DELETE',
                        success: function() {
                            fetchAndRenderData();
                        }
                    });
                }
            });

            $('#exportXLSXBtn').on('click', function() {
                $.get(API_URL, function(rsos) {
                    const dataToExport = rsos.map(rso => ({
                        'Num RSO': rso.numRSO,
                        'Data': rso.data,
                        'Hora Início': rso.hrInicio,                        
                        'PPRi': rso.numPPRi,
                        'Viatura': rso.vtr,
                        'CGP': rso.cgp,
                        'BOp': rso.bop,
                        'Serviço': rso.tpSvc,
                        'Encarregado': rso.enc,
                        'Aux-1': rso.aux1,
                        'Aux-2': rso.aux2,
                        'Aux-3': rso.aux3,
                        'Observações': rso.obs

                    }));

                    const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Numerador de RSO");
                    XLSX.writeFile(workbook, "registros_rso.xlsx");
                });
            });

            $('#addVtr, #editVtr').mask('A-00000', { translation: { 'A': { pattern: /[A-Za-z]/ } } });
            $('#addHrInicio, #editHrInicio').mask('00:00');
            $('#addVtr, #editVtr').on('input', function() {
                let val = $(this).val();
                if (val.length > 0) {
                    $(this).val(val.charAt(0).toUpperCase() + val.slice(1));
                }
            });

            $(document).on('click', '#btnEditar', function() {
                const id = $(this).data('id');
                $.get(`${API_URL}/${id}`, function(rso) {
                    $('#rsoNumModalEdit').text(rso.numRSO);

                    $('#editId').val(rso._id);
                    $('#editData').val(rso.data);
                    $('#editHrInicio').val(rso.hrInicio);            
                    $('#editNumPPRi').val(rso.numPPRi);
                    $('#editCgp').val(rso.cgp);
                    $('#editVtr').val(rso.vtr);
                    $('#editBop').val(rso.bop);
                    $('#editTpSvc').val(rso.tpSvc);
                    $('#editEnc').val(rso.enc);
                    $('#editAux1').val(rso.aux1);
                    $('#editAux2').val(rso.aux2);
                    $('#editAux3').val(rso.aux3);
                    $('#editObs').val(rso.obs);

                    $('#editarModal').modal('show');
                });
            });

            $(document).on('click', '.btn-details', function() {
                const id = $(this).data('id');
                $.get(`${API_URL}/${id}`, function(rso) {
                    // o jQuery seleciona o elemento com o ID "rsoNumModal" e Adiciona esta linha para preencher o cabeçalho do modal
                    $('#rsoNumModal').text(rso.numRSO);

                    let dataFormatada = rso.data ? rso.data.split('-').reverse().join('-') : '';
                    let html = `
                        <div class="mb-2"><strong style="color:#0d6efd;">ID:</strong> ${rso._id}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">RSO Num:</strong> ${rso.numRSO}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Data:</strong> ${dataFormatada}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Hora Inicio:</strong> ${rso.hrInicio}</div>                
                        <div class="mb-2"><strong style="color:#0d6efd;">PPRi Num:</strong> ${rso.numPPRi}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Viatura:</strong> ${rso.vtr}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">CGP:</strong> ${rso.cgp}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">BOp:</strong> ${rso.bop}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Serviço:</strong> ${rso.tpSvc}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Enc:</strong> ${rso.enc}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Aux-1:</strong> ${rso.aux1}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Aux-2:</strong> ${rso.aux2}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Aux-3:</strong> ${rso.aux3}</div>
                        <hr>
                    `;
                    const camposSecundarios = ['obs', 'createdAt', 'updatedAt'];
                    const nomesCampos = {
                        obs: 'Observações', createdAt: 'Data/Hora de Inclusão', updatedAt: 'Data/Hora de Alteração'
                    };
                    camposSecundarios.forEach(campo => {
                        let valor = rso[campo] || '';
                        if (campo === 'createdAt' || campo === 'updatedAt') {
                            valor = valor ? new Date(valor).toLocaleString('pt-BR') : '';
                        }
                        html += `<div class="mb-2"><strong>${nomesCampos[campo]}:</strong> ${valor}</div>`;
                    });
                    html += `<div class="mt-3 text-end"><button class="btn btn-warning" id="btnEditar" data-id="${rso._id}" data-bs-dismiss="modal"><i class="bi bi-pencil"></i> Editar</button></div>`;
                    $('#detalhesModal .modal-body').html(html);
                });
            });
        });
    </script>
</body>
