<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Contadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
    </style>
</head>
<body>
    <div id="navbarContainer"></div>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-gear-fill me-2"></i>Gerenciar Contadores</h2>
            </div>
            <div class="card-body p-4">
                <div class="mb-3">
                    <label for="collectionSelect" class="form-label">Selecione a Tabela:</label>
                    <select class="form-select" id="collectionSelect">
                        <option value="">-- Selecione uma tabela --</option>
                        <option value="rsocounters">RSO</option>
                        <option value="movcounters">Movimentação</option>
                        </select>
                </div>
                <div class="mb-3">
                    <label for="currentCounter" class="form-label">Valor Atual do Numerador:</label>
                    <input type="number" class="form-control" id="currentCounter" readonly>
                </div>
                <div class="mb-3">
                    <label for="newCounter" class="form-label">Alterar Numerador para:</label>
                    <input type="number" class="form-control" id="newCounter" placeholder="Digite o novo valor">
                </div>
                <div class="d-flex justify-content-end">
                    <button class="btn btn-secondary me-2" id="btnCancel">Cancelar</button>
                    <button class="btn btn-gradient" id="btnUpdate">OK</button>
                </div>
                <div id="statusMessage" class="mt-3 text-center d-none"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

    <script>
    const API_COUNTER_URL = 'http://localhost:3001/api/num';

    function updateCounterValue(collectionName) {
        if (!collectionName) {
            console.log('Nenhuma tabela selecionada.');
            $('#currentCounter').val('');
            return;
        }

        $.get(`${API_COUNTER_URL}/${collectionName}`, function(data) {

            $('#currentCounter').val(data.seq);
        }).fail(function() {
            $('#currentCounter').val('Erro ao carregar.');
            $('#statusMessage').text('Erro ao buscar o contador.').removeClass('d-none').addClass('text-danger');
        });
    }


    $(document).ready(function() {
        $("#navbarContainer").load("alterarNum_navbar.html");
        
        // Adicione os event listeners aqui diretamente
        $('#collectionSelect').on('change', function() {
            const selectedCollection = $(this).val();
            console.log('Tabela selecionada:', selectedCollection);
            updateCounterValue(selectedCollection);
            $('#newCounter').val('');
            $('#statusMessage').addClass('d-none').text('');
        });

        $('#btnUpdate').on('click', function() {
            const selectedCollection = $('#collectionSelect').val();
            const newSeq = $('#newCounter').val();

            if (!selectedCollection || newSeq === '') {
                $('#statusMessage').text('Por favor, selecione uma tabela e digite um novo valor.').removeClass('d-none').addClass('text-danger');
                return;
            }

            $.ajax({
                url: `${API_COUNTER_URL}/${selectedCollection}`,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({ seq: parseInt(newSeq, 10) }),
                success: function(response) {
                    $('#statusMessage').text(`Numerador de ${selectedCollection} atualizado para ${response.seq}!`).removeClass('d-none').addClass('text-success');
                    updateCounterValue(selectedCollection);
                    $('#newCounter').val('');
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    $('#statusMessage').text(`Erro ao atualizar: ${jqXHR.responseJSON.message || 'Erro desconhecido'}`).removeClass('d-none').addClass('text-danger');
                }
            });
        });

        $('#btnCancel').on('click', function() {
            $('#collectionSelect').val('');
            $('#currentCounter').val('');
            $('#newCounter').val('');
            $('#statusMessage').addClass('d-none').text('');
        });

        // Chama a função para popular o campo do valor atual quando a página carrega, se houver uma opção selecionada
        const initialCollection = $('#collectionSelect').val();
        if (initialCollection) {
            updateCounterValue(initialCollection);
        }
    });

</script>
</body>
</html>
