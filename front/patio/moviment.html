<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
        .table-responsive {
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .btn-action {
            margin: 0 3px;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #loadingMessage {
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            color: #6c757d;
        }
        .sticky-table-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #fff;
        }
        .outlook-modal .form-label {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .outlook-modal .form-control, .outlook-modal .form-select {
            margin-bottom: 0.75rem;
        }
        .preview-container {
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-top: 1rem;
            background-color: #f8f9fa;
            max-height: 300px;
            overflow-y: auto;
        }
        .modal-lg-custom {
            max-width: 900px;
        }
        .btn-outlook {
            background-color: #0078d4;
            color: white;
            border: none;
        }
        .btn-outlook:hover {
            background-color: #106ebe;
            color: white;
        }
    </style>
</head>
<body>
    <div id="navbarContainer"></div>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-table me-2"></i>Lista dos veículos movimentados para pátio credenciado</h2>
            </div>
            <div class="card-body p-4">
                
                <div id="loadingMessage" class="d-none">Carregando...</div>
                
                <div class="table-responsive">
                    <table id="movTable" class="table table-striped table-hover">
                        <thead class="sticky-table-header">
                            <tr>
                                <th>Num Reg</th>
                                <th>Num RV</th>
                                <th>Placa Veículo</th>
                                <th>Dt moviment</th>
                                <th>Cidade Pátio</th>
                                <th>Num msg P/3</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Detalhes -->
    <div class="modal fade" id="detalhesModal" tabindex="-1" aria-labelledby="detalhesModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detalhesModalLabel">Detalhes do Registro: <span id="movNumModal"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Editar -->
    <div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editarModalLabel">Editar Registro: <span id="movNumModalEdit"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3"><label for="editEventoDER" class="form-label">Num evento DER</label><input type="text" class="form-control" id="editEventoDER" required></div>
                        <div class="mb-3"><label for="editAtendDER" class="form-label">Nome atendente DER</label><input type="text" class="form-control" id="editAtendDER"></div>                        
                        <div class="mb-3"><label for="editNumRV" class="form-label">Núm RV</label><input type="text" class="form-control" id="editNumRV"></div>
                        <div class="mb-3"><label for="editNumBO" class="form-label">Núm BO</label><input type="text" class="form-control" id="editNumBO"></div>
                        <div class="mb-3"><label for="editSituacao" class="form-label">Situação</label><input type="text" class="form-control" id="editSituacao"></div>
                        <div class="mb-3"><label for="editMarca" class="form-label">Marca</label><input type="text" class="form-control" id="editMarca"></div>
                        <div class="mb-3"><label for="editModelo" class="form-label">Modelo</label><input type="text" class="form-control" id="editModelo"></div>
                        <div class="mb-3"><label for="editPlaca" class="form-label">Placa</label><input type="text" class="form-control" id="editPlaca"></div>
                        <div class="mb-3"><label for="editPatioDt" class="form-label">Dt mov ao pátio</label><input type="text" class="form-control" id="editPatioDt"></div>
                        <div class="mb-3"><label for="editPatioLoc" class="form-label">Cidade do pátio</label><input type="text" class="form-control" id="editPatioLoc"></div>
                        <div class="mb-3"><label for="editGuinchoPlaca" class="form-label">Placa do Guincho</label><input type="text" class="form-control" id="editGuinchoPlaca"></div>
                        <div class="mb-3"><label for="editGuinchoNome" class="form-label">Nome do Guincheiro</label><input type="text" class="form-control" id="editGuinchoNome"></div>
                        <div class="mb-3"><label for="editNumMsg" class="form-label">Núm msg P/3</label><input type="text" class="form-control" id="editNumMsg"></div>
                        <div class="mb-3"><label for="editObs" class="form-label">Observações</label><input type="text" class="form-control" id="editObs"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="salvarEdicao">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Gerar Mensagem Outlook -->
    <div class="modal fade" id="outlookModal" tabindex="-1" aria-labelledby="outlookModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-lg-custom">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="outlookModalLabel"><i class="bi bi-envelope-plus me-2"></i>Gerar Mensagem para Outlook</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body outlook-modal">
                    <form id="outlookForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="destinatario" class="form-label">Destinatário:</label>
                                    <input type="email" class="form-control" id="destinatario">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="assunto" class="form-label">Assunto:</label>
                                    <input type="text" class="form-control" id="assunto">
                                </div>
                            </div>
                        </div>
                        
<!--                         <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="placa" class="form-label">Placa do Veículo:</label>
                                    <input type="text" class="form-control" id="placa">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="marca" class="form-label">Marca:</label>
                                    <input type="text" class="form-control" id="marca">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="modelo" class="form-label">Modelo:</label>
                                    <input type="text" class="form-control" id="modelo">
                                </div>
                            </div>
                        </div> -->
                        
<!--                         <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="numReg" class="form-label">Número do Registro:</label>
                                    <input type="text" class="form-control" id="numReg">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="dataMovimentacao" class="form-label">Data de Movimentação:</label>
                                    <input type="text" class="form-control" id="dataMovimentacao">
                                </div>
                            </div>
                        </div> -->
                        
                        <div class="mb-3">
                            <label for="mensagem" class="form-label">Mensagem:</label>
                            <textarea class="form-control" id="mensagem" rows="5" required></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Pré-visualização da Mensagem:</label>
                            <div class="preview-container" id="previewMensagem">
                                <!-- A pré-visualização será gerada aqui -->
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary" id="btnGerarOutlook">
                        <i class="bi bi-envelope-plus me-1"></i> Gerar Mensagem no Outlook
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3001/api/mov';
        let currentMovimentacao = {};

        function renderTable(movs) {
            const tableBody = $('#movTable tbody');
            tableBody.empty();
            $('#loadingMessage').addClass('d-none');
            $('.table-responsive').removeClass('d-none');

            if (movs.length === 0) {
                tableBody.append('<tr><td colspan="7" class="text-center">Nenhum registro encontrado.</td></tr>');
                return;
            }            
            
            movs.forEach(mov => {
                const dataFormatada = mov.patioDt ? mov.patioDt.split('-').reverse().join('-') : '';
                const newRow = `
                    <tr>
                        <td>${mov.numReg || ''}</td>
                        <td>${mov.numRV || ''}</td>
                        <td>${mov.placa || ''}</td>
                        <td>${dataFormatada || ''}</td>
                        <td>${mov.patioLoc || ''}</td>
                        <td>${mov.numMsg || ''}</td>
                        <td class="text-center">
                            <button class="btn btn-info btn-action btn-details" data-id="${mov._id}" data-bs-toggle="modal" data-bs-target="#detalhesModal">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-outlook btn-action btn-outlook" data-id="${mov._id}" title="Gerar mensagem Outlook">
                                <i class="bi bi-envelope-plus"></i>
                            </button>
                            <button class="btn btn-danger btn-action btn-delete" data-id="${mov._id}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tableBody.append(newRow);
            });
        }

        function fetchAndRenderData() {
            $('#loadingMessage').removeClass('d-none');
            $('.table-responsive').addClass('d-none');
            
            $.get(API_URL, function(movs) {
                renderTable(movs);
            }).fail(function() {
                $('#loadingMessage').text('Erro ao carregar dados. Tente novamente.');
            });
        }

        function getFormData() {
            return {
                eventoDER: $('#addEventoDER').val(),
                atendDER: $('#addAtendDER').val(),
                numRV: $('#addNumRV').val(),
                numBO: $('#addNumBO').val(),
                situacao: $('#addSituacao').val(),
                marca: $('#addMarca').val(),
                modelo: $('#addModelo').val(),
                placa: $('#addPlaca').val(),
                patioDt: $('#addPatioDt').val(),
                patioLoc: $('#addPatioLoc').val(),
                guinchoPlaca: $('#addGuinchoPlaca').val(),
                guinchoNome: $('#addGuinchoNome').val(),
                numMsg: $('#addNumMsg').val(),
                obs: $('#addObs').val()
            };
        }

        // Função para abrir o modal com os dados da movimentação
        function abrirModalOutlook(mov) {
            currentMovimentacao = mov;
            
            // Formatar a data
            let dataFormatada = '';
            if (mov.patioDt) {
                const partes = mov.patioDt.split('-');
                if (partes.length === 3) {
                    dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
                } else {
                    dataFormatada = mov.patioDt;
                }
            }

            // Formatar a data ATUAL
            function getDataAtualExtenso() {
                const data = new Date();
                const dia = data.getDate();
                const meses = [
                    'Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun',
                    'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'
                ];
                const mes = meses[data.getMonth()];
                const ano = data.getFullYear();
                
                return `${dia}${mes}${ano}`;
            }

            // No seu código:
            let dataFormatadaAtual = getDataAtualExtenso(); // Retorna "15 de outubro de 2023"
            
            // Preencher o formulário com os dados
            $('#destinatario').val(`5bprv2ciap3@policiamilitar.sp.gov.br`); // Limpar o campo de destinatário
            $('#assunto').val(`Movimentação de Veículo - Placa: ${mov.placa || 'N/A'} para pátio credênciado`);
            $('#placa').val(mov.placa || '');
            $('#marca').val(mov.marca || '');
            $('#modelo').val(mov.modelo || '');
            $('#numReg').val(mov.numReg || '');
            $('#dataMovimentacao').val(dataFormatada);
            
            // Gerar mensagem padrão
            const mensagemPadrao = `MENSAGEM Nº 5BPRv-${mov.numMsg}, de ${dataFormatadaAtual}.\n` +
                                    `Do PDR da 2ª Cia do 5º BPRv\n` +
                                    `Ao Sr Cmt da 2ª Cia do 5º BPRv.\n` +
                                    `Assunto: Movimentação de veículo para pátio credênciado.\n` + 
                                    `\n\n` +
                                    `1.Informo que o veículo de Placas: ${mov.placa || 'N/A'} e Marca/Modelo: ${mov.marca || 'N/A'} / ${mov.modelo || 'N/A'}\n` +
                                    `1.1. Recolhido mediante ARV Nº: ${mov.numRV || 'N/A'}, BO Nº: ${mov.numBO}, por: ${mov.situacao || 'N/A'}\n` +
                                    `1.2. Foi movimentado em ${dataFormatada} para o pátio credenciado na cidade de ${mov.patioLoc || 'N/A'}, pelo guincho de Placas: ${mov.guinchoPlaca || 'N/A'}, conduzido pelo Sr: ${mov.guinchoNome || 'N/A'}.\n` +
                                    `\n\n` +
                                    `Assinatura\n`

            // Gerar a mensagem em HTML
            const mensagemHTML12 = `
            <div style="font-family: 'Times New Roman', Times, serif; font-size: 12pt;">
                <p>MENSAGEM Nº 5BPRv-${mov.numMsg || 'N/A'}, de ${dataFormatadaAtual}.</p>                
                <p><strong>Do</strong> PDR da 2ª Cia do 5º BPRv</p>
                <p><strong>Ao</strong> Sr Cmt da 2ª Cia do 5º BPRv.</p>                
                <p><strong>Assunto:</strong> Movimentação de veículo para pátio credenciado.</p>
                
                <p>1. Informo que o veículo de <strong>Placas:</strong> ${mov.placa || 'N/A'} e <strong>Marca/Modelo:</strong> ${mov.marca || 'N/A'} / ${mov.modelo || 'N/A'}</p>
                
                <p>1.1. Recolhido mediante <strong>ARV Nº:</strong> ${mov.numRV || 'N/A'}, <strong>BO Nº:</strong> ${mov.numBO || 'N/A'}, <strong>por:</strong> ${mov.situacao || 'N/A'}</p>
                
                <p>1.2. Foi movimentado em ${dataFormatada} para o pátio credenciado na <strong>cidade de:</strong> ${mov.patioLoc || 'N/A'}, pelo <strong>guincho de Placas:</strong> ${mov.guinchoPlaca || 'N/A'}, <strong>conduzido pelo Sr:</strong> ${mov.guinchoNome || 'N/A'}.</p>
                
                <p>Assinatura</p>
            </div>
            `;

            const mensagemHTML = `
            <div style="font-family: 'Times New Roman', Times, serif; font-size: 12pt; line-height: 1.0;">
                <style>
                    .mensagem p {
                        margin: 0 0 8px 0;
                        padding: 0;
                        line-height: 1.0;
                    }
                </style>
                
                <div class="mensagem">
                    <p>MENSAGEM Nº 5BPRv-123, de 17Set2025.<br>
                    <strong>Do</strong> PDR da 2ª Cia do 5º BPRv<br>
                    <strong>Ao</strong> Sr Cmt da 2ª Cia do 5º BPRv.<br>
                    <strong>Assunto:</strong> Movimentação de veículo para pátio credenciado.</p>

                    <p>1. Informo que o veículo de <strong>Placas:</strong> ${mov.placa || 'N/A'} e <strong>Marca:</strong> ${mov.marca || 'N/A'} / <strong>Modelo:</strong> ${mov.modelo || 'N/A'}</p>

                    <p>1.1. Recolhido mediante <strong>ARV Nº:</strong> ${mov.numRV || 'N/A'}, <strong>BO Nº:</strong> ${mov.numBO || 'N/A'}, <strong>por:</strong> ${mov.situacao || 'N/A'}</p>

                    <p>1.2. Foi movimentado em ${dataFormatada} para o pátio credenciado na <strong>cidade de:</strong> ${mov.patioLoc || 'N/A'}, pelo <strong>guincho de Placas:</strong> ${mov.guinchoPlaca || 'N/A'}, <strong>conduzido pelo Sr:</strong> ${mov.guinchoNome || 'N/A'}.</p>

                    <p>Assinatura</p>
                </div>
            </div>
            `;
            
            $('#mensagem').val(mensagemHTML);
            
            // Atualizar a pré-visualização
             atualizarPreview();
            
            // Abrir o modal
            const outlookModal = new bootstrap.Modal(document.getElementById('outlookModal'));
            outlookModal.show();
        }

        // Função para atualizar a pré-visualização da mensagem
        function atualizarPreview() {
            const destinatario = $('#destinatario').val();
            const assunto = $('#assunto').val();
            const mensagem = $('#mensagem').val().replace(/\n/g, '<br>');
            
            const previewHtml = `
                <p><strong>Para:</strong> ${destinatario || '[Destinatário]'}</p>
                <p><strong>Assunto:</strong> ${assunto || '[Assunto]'}</p>
                <hr>
                <div>${mensagem || '[Mensagem]'}</div>
            `;
            
            $('#previewMensagem').html(previewHtml);
        }

        // Gerar mensagem no Outlook
        function gerarMensagemOutlook() {
            const destinatario = $('#destinatario').val();
            const assunto = $('#assunto').val();
            const mensagem = $('#mensagem').val();
            
            if (!destinatario || !assunto || !mensagem) {
                alert('Por favor, preencha todos os campos obrigatórios.');
                return;
            }
            
            // Codificar os parâmetros para o mailto
            const assuntoCodificado = encodeURIComponent(assunto);
            // const mensagemCodificada = encodeURIComponent(mensagem);
            const mensagemCodificada = encodeURIComponent(mensagemHTML);

            
            // Criar o link mailto
            const mailtoLink = `mailto:${destinatario}?subject=${assuntoCodificado}&body=${mensagemCodificada}`;
            
            // Abrir o cliente de e-mail
            window.location.href = mailtoLink;
            
            // Fechar o modal
            bootstrap.Modal.getInstance(document.getElementById('outlookModal')).hide();
        }

        $(document).ready(function() {
            fetchAndRenderData();
            $("#navbarContainer").load("patio/mov_navbar.html");

            $('#salvarEdicao').click(function() {
                const id = $('#editId').val();
                const data = {
                    eventoDER: $('#editEventoDER').val(),
                    atendDER: $('#editAtendDER').val(),
                    numRV: $('#editNumRV').val(),
                    numBO: $('#editNumBO').val(),
                    situacao: $('#editSituacao').val(),
                    marca: $('#editMarca').val(),
                    modelo: $('#editModelo').val(),
                    placa: $('#editPlaca').val(),
                    patioDt: $('#editPatioDt').val(),
                    patioLoc: $('#editPatioLoc').val(),
                    guinchoPlaca: $('#editGuinchoPlaca').val(),
                    guinchoNome: $('#editGuinchoNome').val(),
                    numMsg: $('#editNumMsg').val(),
                    obs: $('#editObs').val()
                };
                $.ajax({
                    url: `${API_URL}/${id}`,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function() {
                        $('#editarModal').modal('hide');
                        fetchAndRenderData();
                    }
                });
            });

            $(document).on('click', '.btn-delete', function() {
                const id = $(this).data('id');
                if (confirm('Tem certeza que deseja excluir este registro?')) {
                    $.ajax({
                        url: `${API_URL}/${id}`,
                        type: 'DELETE',
                        success: function() {
                            fetchAndRenderData();
                        }
                    });
                }
            });

            // Event listener para o botão de Outlook
            $(document).on('click', '.btn-outlook', function() {
                const id = $(this).data('id');
                $.get(`${API_URL}/${id}`, function(mov) {
                    abrirModalOutlook(mov);
                });
            });

            // Atualizar a pré-visualização quando os campos mudarem
            // $('#destinatario, #assunto, #mensagem').on('input', atualizarPreview);

            // Event listener para o botão Gerar Mensagem no Outlook
            $('#btnGerarOutlook').on('click', gerarMensagemOutlook);

            $(document).on('click', '#btnEditar', function() {
                const id = $(this).data('id');
                $.get(`${API_URL}/${id}`, function(mov) {
                    $('#movNumModalEdit').text(mov.numReg);

                    $('#editId').val(mov._id);
                    $('#editNumReg').val(mov.numReg);
                    $('#editEventoDER').val(mov.eventoDER);            
                    $('#editAtendDER').val(mov.atendDER);
                    $('#editNumRV').val(mov.numRV);
                    $('#editNumBO').val(mov.numBO);
                    $('#editSituacao').val(mov.situacao);
                    $('#editMarca').val(mov.marca);
                    $('#editModelo').val(mov.modelo);
                    $('#editPlaca').val(mov.placa);
                    $('#editPatioDt').val(mov.patioDt);
                    $('#editPatioLoc').val(mov.patioLoc);                    
                    $('#editGuinchoPlaca').val(mov.guinchoPlaca);
                    $('#editGuinchoNome').val(mov.guinchoNome);
                    $('#editNumMsg').val(mov.numMsg);
                    $('#editObs').val(mov.obs);

                    $('#editarModal').modal('show');
                });
            });

            $(document).on('click', '.btn-details', function() {
                const id = $(this).data('id');
                $.get(`${API_URL}/${id}`, function(mov) {
                    $('#movNumModal').text(mov.numReg);

                    let dataFormatada = mov.patioDt ? mov.patioDt.split('-').reverse().join('-') : '';
                    let html = `
                        <div class="mb-2"><strong style="color:#0d6efd;">ID:</strong> ${mov._id}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Num reg:</strong> ${mov.numReg}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Num evento DER:</strong> ${mov.eventoDER}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Nome atendente DER:</strong> ${mov.atendDER}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Num RV:</strong> ${mov.numRV}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Num BO:</strong> ${mov.numBO}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Situação:</strong> ${mov.situacao}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Marca:</strong> ${mov.marca}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Modelo:</strong> ${mov.modelo}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Placa:</strong> ${mov.placa}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Dt mov ao pátio:</strong> ${dataFormatada}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Cidade do pátio:</strong> ${mov.patioLoc}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Placa do Guincho:</strong> ${mov.guinchoPlaca}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Nome do Guincheiro:</strong> ${mov.guinchoNome}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Num msg P/3:</strong> ${mov.numMsg}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Observações:</strong> ${mov.obs}</div>
                        <hr>
                    `;
                    const camposSecundarios = ['createdAt', 'updatedAt'];
                    const nomesCampos = {
                        createdAt: 'Data/Hora de Inclusão', updatedAt: 'Data/Hora de Alteração'
                    };
                    camposSecundarios.forEach(campo => {
                        let valor = mov[campo] || '';
                        if (campo === 'createdAt' || campo === 'updatedAt') {
                            valor = valor ? new Date(valor).toLocaleString('pt-BR') : '';
                        }
                        html += `<div class="mb-2"><strong>${nomesCampos[campo]}:</strong> ${valor}</div>`;
                    });
                    html += `<div class="mt-3 text-end"><button class="btn btn-warning" id="btnEditar" data-id="${mov._id}" data-bs-dismiss="modal"><i class="bi bi-pencil"></i> Editar</button></div>`;
                    $('#detalhesModal .modal-body').html(html);
                });
            });
        });
    </script>
</body>
</html>
