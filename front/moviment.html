<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white !important;
        }
        .table-responsive {
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .btn-action {
            margin: 0 3px;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #loadingMessage {
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            color: #6c757d;
        }
        .sticky-table-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #fff; /* Adicionado para que o fundo não seja transparente */
        }
    </style>
</head>
<body>
    <div id="navbarContainer"></div>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-table me-2"></i>Lista dos veículos movimentados para pátio credenciado</h2>
            </div>
            <div class="card-body p-4">
                
                <div id="loadingMessage" class="d-none">Carregando...</div>
                
                <div class="table-responsive">
                    <table id="movTable" class="table table-striped table-hover">
                        <thead class="sticky-table-header">
                            <tr>
                                <th>Num Reg</th>
                                <th>Num RV</th>
                                <th>Placa Veículo</th>
                                <th>Dt moviment</th>
                                <th>Cidade Pátio</th>
                                <th>Num msg P/3</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="detalhesModal" tabindex="-1" aria-labelledby="detalhesModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detalhesModalLabel">Detalhes do Registro: <span id="movNumModal"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editarModalLabel">Editar Registro: <span id="movNumModalEdit"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3"><label for="editEventoDER" class="form-label">Num evento DER</label><input type="text" class="form-control" id="editEventoDER" required></div>
                        <div class="mb-3"><label for="editAtendDER" class="form-label">Nome atendente DER</label><input type="text" class="form-control" id="editAtendDER"></div>                        
                        <div class="mb-3"><label for="editNumRV" class="form-label">Núm RV</label><input type="text" class="form-control" id="editNumRV"></div>
                        <div class="mb-3"><label for="editNumBO" class="form-label">Núm BO</label><input type="text" class="form-control" id="editNumBO"></div>
                        <div class="mb-3"><label for="editSituacao" class="form-label">Situação</label><input type="text" class="form-control" id="editSituacao"></div>
                        <div class="mb-3"><label for="editMarca" class="form-label">Marca</label><input type="text" class="form-control" id="editMarca"></div>
                        <div class="mb-3"><label for="editModelo" class="form-label">Modelo</label><input type="text" class="form-control" id="editModelo"></div>
                        <div class="mb-3"><label for="editPlaca" class="form-label">Placa</label><input type="text" class="form-control" id="editPlaca"></div>
                        <div class="mb-3"><label for="editPatioDt" class="form-label">Dt mov ao pátio</label><input type="text" class="form-control" id="editPatioDt"></div>
                        <div class="mb-3"><label for="editPatioLoc" class="form-label">Cidade do pátio</label><input type="text" class="form-control" id="editPatioLoc"></div>
                        <div class="mb-3"><label for="editGuinchoPlaca" class="form-label">Placa do Guincho</label><input type="text" class="form-control" id="editGuinchoPlaca"></div>
                        <div class="mb-3"><label for="editGuinchoNome" class="form-label">Nome do Guincheiro</label><input type="text" class="form-control" id="editGuinchoNome"></div>
                        <div class="mb-3"><label for="editNumMsg" class="form-label">Núm msg P/3</label><input type="text" class="form-control" id="editNumMsg"></div>
                        <div class="mb-3"><label for="editObs" class="form-label">Observações</label><input type="text" class="form-control" id="editObs"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="salvarEdicao">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3001/api/mov';

        function renderTable(movs) {
            const tableBody = $('#movTable tbody');
            tableBody.empty();
            $('#loadingMessage').addClass('d-none');
            $('.table-responsive').removeClass('d-none');

            if (movs.length === 0) {
                tableBody.append('<tr><td colspan="7" class="text-center">Nenhum registro encontrado.</td></tr>');
                return;
            }            
            
            movs.forEach(mov => {
                const dataFormatada = mov.patioDt ? mov.patioDt.split('-').reverse().join('-') : '';
                const newRow = `
                    <tr>
                        <td>${mov.numReg || ''}</td>
                        <td>${mov.numRV || ''}</td>
                        <td>${mov.placa || ''}</td>
                        <td>${dataFormatada || ''}</td>
                        <td>${mov.patioLoc || ''}</td>
                        <td>${mov.numMsg || ''}</td>
                        <td class="text-center">
                            <button class="btn btn-info btn-action btn-details" data-id="${mov._id}" data-bs-toggle="modal" data-bs-target="#detalhesModal">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-danger btn-action btn-delete" data-id="${mov._id}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tableBody.append(newRow);
            });
        }

        function fetchAndRenderData() {
            $('#loadingMessage').removeClass('d-none');
            $('.table-responsive').addClass('d-none');
            
            $.get(API_URL, function(movs) {
                renderTable(movs);
            }).fail(function() {
                $('#loadingMessage').text('Erro ao carregar dados. Tente novamente.');
            });
        }

        function getFormData() {
            return {
                eventoDER: $('#addEventoDER').val(),
                atendDER: $('#addAtendDER').val(),
                numRV: $('#addNumRV').val(),
                numBO: $('#addNumBO').val(),
                situacao: $('#addSituacao').val(),
                marca: $('#addMarca').val(),
                modelo: $('#addModelo').val(),
                placa: $('#addPlaca').val(),
                patioDt: $('#addPatioDt').val(),
                patioLoc: $('#addPatioLoc').val(),
                guinchoPlaca: $('#addGuinchoPlaca').val(),
                guinchoNome: $('#addGuinchoNome').val(),
                numMsg: $('#addNumMsg').val(),
                obs: $('#addObs').val()

            };
        }

        $(document).ready(function() {
            fetchAndRenderData();
            $("#navbarContainer").load("mov_navbar.html");

            $('#salvarEdicao').click(function() {
                const id = $('#editId').val();
                const data = {
                    eventoDER: $('#editEventoDER').val(),
                    atendDER: $('#editAtendDER').val(),
                    numRV: $('#editNumRV').val(),
                    numBO: $('#editNumBO').val(),
                    situacao: $('#editSituacao').val(),
                    marca: $('#editMarca').val(),
                    modelo: $('#editModelo').val(),
                    placa: $('#editPlaca').val(),
                    patioDt: $('#editPatioDt').val(),
                    patioLoc: $('#editPatioLoc').val(),
                    guinchoPlaca: $('#editGuinchoPlaca').val(),
                    guinchoNome: $('#editGuinchoNome').val(),
                    numMsg: $('#editNumMsg').val(),
                    obs: $('#editObs').val()

                };
                $.ajax({
                    url: `${API_URL}/${id}`,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function() {
                        $('#editarModal').modal('hide');
                        fetchAndRenderData();
                    }
                });
            });

            $(document).on('click', '.btn-delete', function() {
                const id = $(this).data('id');
                if (confirm('Tem certeza que deseja excluir este registro?')) {
                    $.ajax({
                        url: `${API_URL}/${id}`,
                        type: 'DELETE',
                        success: function() {
                            fetchAndRenderData();
                        }
                    });
                }
            });

            // $('#exportXLSXBtn').on('click', function() {
            //     $.get(API_URL, function(movs) {
            //         const dataToExport = movs.map(mov => ({
            //             'Num Reg': mov.numReg,
            //             'Num evento DER': mov.eventoDER,
            //             'Nome atendente': mov.atendDER,
            //             'Num BO': mov.numBO,
            //             'Situação': mov.situacao,
            //             'Marca': mov.marca,
            //             'Modelo': mov.modelo,
            //             'Placa': mov.placa,
            //             'Dt mov pátio': mov.patioDt,
            //             'Cidade pátio': mov.patioLoc,
            //             'Placa guincho': mov.guinchoPlaca,
            //             'Nome Guincheiro': mov.guinchoNome,
            //             'Num msg P3': mov.numMsg,
            //             'Observações': mov.obs,

            //         }));

            //         const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            //         const workbook = XLSX.utils.book_new();
            //         XLSX.utils.book_append_sheet(workbook, worksheet, "RRegistros de movimentação de veículos ao pátio credenciado");
            //         XLSX.writeFile(workbook, "movimentacoes_patio.xlsx");
            //     });
            // });

            $('#addVtr, #editVtr').mask('A-00000', { translation: { 'A': { pattern: /[A-Za-z]/ } } });
            $('#addHrInicio, #editHrInicio').mask('00:00');
            $('#addVtr, #editVtr').on('input', function() {
                let val = $(this).val();
                if (val.length > 0) {
                    $(this).val(val.charAt(0).toUpperCase() + val.slice(1));
                }
            });

            $(document).on('click', '#btnEditar', function() {
                const id = $(this).data('id');
                $.get(`${API_URL}/${id}`, function(mov) {
                    $('#movNumModalEdit').text(mov.numReg);

                    $('#editId').val(mov._id);
                    $('#editNumReg').val(mov.numReg);
                    $('#editEventoDER').val(mov.eventoDER);            
                    $('#editAtendDER').val(mov.atendDER);
                    $('#editNumRV').val(mov.numRV);
                    $('#editNumBO').val(mov.numBO);
                    $('#editSituacao').val(mov.situacao);
                    $('#editMarca').val(mov.marca);
                    $('#editModelo').val(mov.modelo);
                    $('#editPlaca').val(mov.placa);
                    $('#editPatioDt').val(mov.patioDt);
                    $('#editPatioLoc').val(mov.patioLoc);                    
                    $('#editGuinchoPlaca').val(mov.guinchoPlaca);
                    $('#editGuinchoNome').val(mov.guinchoNome);
                    $('#editNumMsg').val(mov.numMsg);
                    $('#editObs').val(mov.obs);

                    $('#editarModal').modal('show');
                });
            });

            $(document).on('click', '.btn-details', function() {
                const id = $(this).data('id');
                $.get(`${API_URL}/${id}`, function(mov) {
                    // o jQuery seleciona o elemento com o ID "rsoNumModal" e Adiciona esta linha para preencher o cabeçalho do modal
                    $('#movNumModal').text(mov.numReg);

                    let dataFormatada = mov.data ? mov.data.split('-').reverse().join('-') : '';
                    let html = `
                        <div class="mb-2"><strong style="color:#0d6efd;">ID:</strong> ${mov._id}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">RSO Num:</strong> ${mov.numReg}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Num evento DER:</strong> ${mov.eventoDER}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Nome atendente DER:</strong> ${mov.atendDER}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Num RV:</strong> ${mov.numRV}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Num BO:</strong> ${mov.numBO}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Situação:</strong> ${mov.situacao}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Marca:</strong> ${mov.marca}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Modelo:</strong> ${mov.modelo}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Placa:</strong> ${mov.placa}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Dt mov ao pátio:</strong> ${dataFormatada}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Cidade do pátio:</strong> ${mov.patioLoc}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Placa do Guincho:</strong> ${mov.guinchoPlaca}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Nome do Guincheiro:</strong> ${mov.guinchoNome}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Num msg P/3:</strong> ${mov.numMsg}</div>
                        <div class="mb-2"><strong style="color:#0d6efd;">Observações:</strong> ${mov.obs}</div>
                        <hr>
                    `;
                    const camposSecundarios = ['createdAt', 'updatedAt'];
                    const nomesCampos = {
                        createdAt: 'Data/Hora de Inclusão', updatedAt: 'Data/Hora de Alteração'
                    };
                    camposSecundarios.forEach(campo => {
                        let valor = mov[campo] || '';
                        if (campo === 'createdAt' || campo === 'updatedAt') {
                            valor = valor ? new Date(valor).toLocaleString('pt-BR') : '';
                        }
                        html += `<div class="mb-2"><strong>${nomesCampos[campo]}:</strong> ${valor}</div>`;
                    });
                    html += `<div class="mt-3 text-end"><button class="btn btn-warning" id="btnEditar" data-id="${mov._id}" data-bs-dismiss="modal"><i class="bi bi-pencil"></i> Editar</button></div>`;
                    $('#detalhesModal .modal-body').html(html);
                });
            });
        });
    </script>
</body>
</html>
