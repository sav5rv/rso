<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Usuários</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .password-toggle {
            cursor: pointer;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-left: none;
            border-radius: 0 0.375rem 0.375rem 0;
        }
        .input-group-text {
            background-color: #f8f9fa;
        }
        .required-field::after {
            content: " *";
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header text-center py-3">
                        <h2><i class="bi bi-person-plus-fill me-2"></i>Cadastro de Usuário</h2>
                    </div>
                    <div class="card-body p-4">
                        <form id="userForm">
                            <div class="mb-3">
                                <label for="nome" class="form-label required-field">Nome Completo</label>
                                <input type="text" class="form-control" id="nome" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label required-field">E-mail</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="celular" class="form-label required-field">Celular</label>
                                <input type="text" class="form-control" id="celular" placeholder="(XX) XXXXX-XXXX" required>
                            </div>

                            <div class="mb-3">
                                <label for="dataNascimento" class="form-label required-field">Data de Nascimento</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="dataNascimento" placeholder="DD-MM-YYYY" required>
                                    <span class="input-group-text" id="calendarioBtn"><i class="bi bi-calendar"></i></span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="senha" class="form-label required-field">Senha</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="senha" required>
                                    <span class="input-group-text password-toggle" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </span>
                                </div>
                                <div class="form-text">Mínimo 8 caracteres, incluindo letras, números e caracteres especiais</div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="button" class="btn btn-secondary me-md-2" id="cancelarBtn">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </button>
                                <button type="button" class="btn btn-info me-md-2" id="localizarBtn" data-bs-toggle="modal" data-bs-target="#localizarModal">
                                    <i class="bi bi-search"></i> Localizar
                                </button>
                                <button type="submit" class="btn btn-gradient" id="cadastrarBtn">
                                    <i class="bi bi-person-plus"></i> Cadastrar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Localizar Usuários -->
    <div class="modal fade" id="localizarModal" tabindex="-1" aria-labelledby="localizarModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="localizarModalLabel">Localizar Usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="busca" class="form-label">Digite o nome ou e-mail do usuário:</label>
                        <input type="text" class="form-control" id="busca">
                    </div>
                    <button type="button" class="btn btn-primary mb-3" id="buscarBtn">Buscar</button>
                    
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>E-mail</th>
                                    <th>Celular</th>
                                    <th>Selecionar</th>
                                </tr>
                            </thead>
                            <tbody id="resultadosBusca">
                                <!-- Resultados da busca serão inseridos aqui -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & jQuery JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery Mask Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // Aplicar máscaras aos campos
            $('#celular').mask('(00) 00000-0000');
            $('#dataNascimento').mask('00-00-0000');
            
            // Configurar o botão de calendário
            $('#calendarioBtn').click(function() {
                $('#dataNascimento').focus();
            });
            
            // Configurar o toggle de visualização de senha
            $('#togglePassword').click(function() {
                const senhaInput = $('#senha');
                const tipo = senhaInput.attr('type') === 'password' ? 'text' : 'password';
                senhaInput.attr('type', tipo);
                $(this).find('i').toggleClass('bi-eye bi-eye-slash');
            });
            
            // Validação do formulário
            $('#userForm').on('submit', function(e) {
                e.preventDefault();
                
                // Validar campos obrigatórios
                let isValid = true;
                $('input[required]').each(function() {
                    if ($(this).val() === '') {
                        isValid = false;
                        $(this).addClass('is-invalid');
                    } else {
                        $(this).removeClass('is-invalid');
                    }
                });
                
                // Validar senha
                const senha = $('#senha').val();
                const senhaRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$/;
                if (!senhaRegex.test(senha)) {
                    isValid = false;
                    $('#senha').addClass('is-invalid');
                    alert('A senha deve ter pelo menos 8 caracteres, incluindo letras, números e caracteres especiais.');
                } else {
                    $('#senha').removeClass('is-invalid');
                }
                
                if (isValid) {
                    // Simular cadastro bem-sucedido
                    const nome = $('#nome').val();
                    const random = Math.random();
                    
                    if (random > 0.3) { // 70% de chance de sucesso
                        alert(`Usuário: ${nome}, cadastrado com sucesso!`);
                        window.location.href = 'login.html'; // Redirecionar para tela de login
                    } else {
                        alert(`Erro ao cadastrar o usuário: ${nome}`);
                    }
                }
            });
            
            // Botão Cancelar
            $('#cancelarBtn').click(function() {
                $('#userForm')[0].reset();
                $('input').removeClass('is-invalid');
                // Simular redirecionamento para tela de login
                alert('Operação cancelada. Redirecionando para login...');
                window.location.href = 'login.html';
            });
            
            // Simulação de busca de usuários
            $('#buscarBtn').click(function() {
                const termo = $('#busca').val().toLowerCase();
                const usuarios = [
                    { nome: 'João Silva', email: 'joao@email.com', celular: '(11) 99999-9999' },
                    { nome: 'Maria Santos', email: 'maria@email.com', celular: '(11) 98888-8888' },
                    { nome: 'Pedro Oliveira', email: 'pedro@email.com', celular: '(11) 97777-7777' }
                ];
                
                let resultadosHTML = '';
                
                if (termo) {
                    const resultados = usuarios.filter(user => 
                        user.nome.toLowerCase().includes(termo) || 
                        user.email.toLowerCase().includes(termo)
                    );
                    
                    if (resultados.length > 0) {
                        resultados.forEach(user => {
                            resultadosHTML += `
                                <tr>
                                    <td>${user.nome}</td>
                                    <td>${user.email}</td>
                                    <td>${user.celular}</td>
                                    <td>
                                        <button class="btn btn-sm btn-primary selecionar-usuario" 
                                                data-nome="${user.nome}" 
                                                data-email="${user.email}" 
                                                data-celular="${user.celular}">
                                            Selecionar
                                        </button>
                                    </td>
                                </tr>
                            `;
                        });
                    } else {
                        resultadosHTML = '<tr><td colspan="4" class="text-center">Nenhum usuário encontrado</td></tr>';
                    }
                } else {
                    resultadosHTML = '<tr><td colspan="4" class="text-center">Digite um termo para buscar</td></tr>';
                }
                
                $('#resultadosBusca').html(resultadosHTML);
                
                // Configurar botões de seleção
                $('.selecionar-usuario').click(function() {
                    const nome = $(this).data('nome');
                    const email = $(this).data('email');
                    const celular = $(this).data('celular');
                    
                    $('#nome').val(nome);
                    $('#email').val(email);
                    $('#celular').val(celular);
                    
                    $('#localizarModal').modal('hide');
                });
            });
        });
    </script>
</body>
</html>
