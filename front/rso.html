<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);

        }
        .card-header {
            border-radius: 1rem 1rem 0 0 !important;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            color: white;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #0b5ed7, #0ba9c8);
            color: white;
        }
        .navbar-custom {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            margin-bottom: 20px;
            border-radius: 1rem;

        .navbar-custom .navbar-brand, .navbar-custom .nav-link {

        }
        .table-responsive {
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .btn-action {

            width: 35px;
            height: 35px;

</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-shield-check"></i> Sistema
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cadastro.html"><i class="bi bi-person-plus"></i> Cadastro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="bi bi-table"></i> RSO</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header text-center py-3">
                <h2><i class="bi bi-table me-2"></i>Registros RSO</h2>
            </div>
            <div class="card-body p-4">
                <div class="d-flex justify-content-between mb-3">
                    <button class="btn btn-gradient" data-bs-toggle="modal" data-bs-target="#adicionarModal">
                        <i class="bi bi-plus-circle"></i> Adicionar Registro
                    </button>
                        <!--  <div>
                        <button class="btn btn-success" id="exportExcel">
                            <i class="bi bi-file-earmark-excel"></i> Exportar XLSX
                        </button>
                        <button class="btn btn-danger" id="exportPDF">
                            <i class="bi bi-file-earmark-pdf"></i> Exportar PDF
                        </button>
                    </div> -->
                </div>
                
                <div class="table-responsive">
                    <table id="rsoTable" class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <!-- <th>ID</th> -->
                                <th>RSO Num</th>
                                <th>Data</th>
                                <th>PPRi</th>
                                <th>Viatura</th>
                                <th>Encarregado</th>
                                <th>BOp</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="rsoTableBody">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal Detalhes -->
    <div class="modal fade" id="detalhesModal" tabindex="-1" aria-labelledby="detalhesModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detalhesModalLabel">Detalhes do Registro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Conteúdo gerado via JS -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal Editar -->
    <div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editarModalLabel">Editar Registro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3"><label for="editNumRSO" class="form-label">numRSO</label><input type="text" class="form-control" id="editNumRSO" required></div>
                        <div class="mb-3"><label for="editData" class="form-label">Data</label><input type="date" class="form-control" id="editData" required></div>
                        <div class="mb-3"><label for="editNumPPRi" class="form-label">numPPRi</label><input type="text" class="form-control" id="editNumPPRi"></div>
                        <div class="mb-3"><label for="editEncEq" class="form-label">Encarregado</label><input type="text" class="form-control" id="editEncEq"></div>
                        <div class="mb-3"><label for="editVtr" class="form-label">VTR</label><input type="text" class="form-control" id="editVtr"></div>
                        <div class="mb-3"><label for="editBop" class="form-label">BOP</label><input type="text" class="form-control" id="editBop"></div>
                        <div class="mb-3"><label for="editTpSvc" class="form-label">Tipo Serviço</label><input type="text" class="form-control" id="editTpSvc"></div>
                        <div class="mb-3"><label for="editAux1" class="form-label">Aux1</label><input type="text" class="form-control" id="editAux1"></div>
                        <div class="mb-3"><label for="editAux2" class="form-label">Aux2</label><input type="text" class="form-control" id="editAux2"></div>
                        <div class="mb-3"><label for="editAux3" class="form-label">Aux3</label><input type="text" class="form-control" id="editAux3"></div>
                        <div class="mb-3"><label for="editHrInicio" class="form-label">Hora Início</label><input type="text" class="form-control" id="editHrInicio"></div>
                        <div class="mb-3"><label for="editQtdFisc" class="form-label">Qtd Fisc</label><input type="text" class="form-control" id="editQtdFisc"></div>
                        <div class="mb-3"><label for="editQtdAut" class="form-label">Qtd Aut</label><input type="text" class="form-control" id="editQtdAut"></div>
                        <div class="mb-3"><label for="editQtBO" class="form-label">Qt BO</label><input type="text" class="form-control" id="editQtBO"></div>
                        <div class="mb-3"><label for="editQtARV" class="form-label">Qt ARV</label><input type="text" class="form-control" id="editQtARV"></div>
                        <div class="mb-3"><label for="editQtdARD" class="form-label">Qtd ARD</label><input type="text" class="form-control" id="editQtdARD"></div>
                        <div class="mb-3"><label for="editQtdImg" class="form-label">Qtd Img</label><input type="text" class="form-control" id="editQtdImg"></div>
                        <div class="mb-3"><label for="editQtdTestes" class="form-label">Qtd Testes</label><input type="text" class="form-control" id="editQtdTestes"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="salvarEdicao">Salvar</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal Adicionar -->
    <div class="modal fade" id="adicionarModal" tabindex="-1" aria-labelledby="adicionarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adicionarModalLabel">Adicionar Novo Registro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3"><label for="addNumRSO" class="form-label">numRSO</label><input type="text" class="form-control" id="addNumRSO" required></div>
                        <div class="mb-3"><label for="addData" class="form-label">Data</label><input type="date" class="form-control" id="addData" required></div>
                        <div class="mb-3"><label for="addNumPPRi" class="form-label">numPPRi</label><input type="text" class="form-control" id="addNumPPRi"></div>
                        <div class="mb-3"><label for="addEncEq" class="form-label">Encarregado</label><input type="text" class="form-control" id="addEncEq"></div>
                        <div class="mb-3"><label for="addVtr" class="form-label">VTR</label><input type="text" class="form-control" id="addVtr"></div>
                        <div class="mb-3"><label for="addBop" class="form-label">BOP</label><input type="text" class="form-control" id="addBop"></div>
                        <div class="mb-3"><label for="addTpSvc" class="form-label">Tipo Serviço</label><input type="text" class="form-control" id="addTpSvc"></div>
                        <div class="mb-3"><label for="addAux1" class="form-label">Aux1</label><input type="text" class="form-control" id="addAux1"></div>
                        <div class="mb-3"><label for="addAux2" class="form-label">Aux2</label><input type="text" class="form-control" id="addAux2"></div>
                        <div class="mb-3"><label for="addAux3" class="form-label">Aux3</label><input type="text" class="form-control" id="addAux3"></div>
                        <div class="mb-3"><label for="addHrInicio" class="form-label">Hora Início</label><input type="text" class="form-control" id="addHrInicio"></div>
                        <div class="mb-3"><label for="addQtdFisc" class="form-label">Qtd Fisc</label><input type="text" class="form-control" id="addQtdFisc"></div>
                        <div class="mb-3"><label for="addQtdAut" class="form-label">Qtd Aut</label><input type="text" class="form-control" id="addQtdAut"></div>
                        <div class="mb-3"><label for="addQtBO" class="form-label">Qt BO</label><input type="text" class="form-control" id="addQtBO"></div>
                        <div class="mb-3"><label for="addQtARV" class="form-label">Qt ARV</label><input type="text" class="form-control" id="addQtARV"></div>
                        <div class="mb-3"><label for="addQtdARD" class="form-label">Qtd ARD</label><input type="text" class="form-control" id="addQtdARD"></div>
                        <div class="mb-3"><label for="addQtdImg" class="form-label">Qtd Img</label><input type="text" class="form-control" id="addQtdImg"></div>
                        <div class="mb-3"><label for="addQtdTestes" class="form-label">Qtd Testes</label><input type="text" class="form-control" id="addQtdTestes"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & jQuery JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>


<script>
const API_URL = 'http://localhost:3001/api/rso';

function renderTable(rsos) {
    const tbody = $('#rsoTableBody');
    tbody.empty();
    rsos.forEach(rso => {
        tbody.append(`
            <tr>
                <td>${rso.numRSO || ''}</td>
                <td>${rso.data || ''}</td>
                <td>${rso.numPPRi || ''}</td>
                <td>${rso.encEq || ''}</td>
                <td>${rso.vtr || ''}</td>
                <td>${rso.bop || ''}</td>

                <td>
                    <button class="btn btn-info btn-action btn-details" data-id="${rso._id}" data-bs-toggle="modal" data-bs-target="#detalhesModal">
                        <i class="bi bi-eye"></i>
                    </button>
                </td>
            </tr>
        `);
    });
}

function getFormData() {
    return {
        numRSO: $('#addNumRSO').val(),
        data: $('#addData').val(),
        numPPRi: $('#addNumPPRi').val(),
        encEq: $('#addEncEq').val(),
        vtr: $('#addVtr').val(),
        bop: $('#addBop').val(),
        tpSvc: $('#addTpSvc').val(),
        aux1: $('#addAux1').val(),
        aux2: $('#addAux2').val(),
        aux3: $('#addAux3').val(),
        hrInicio: $('#addHrInicio').val(),
        qtdFisc: $('#addQtdFisc').val(),
        qtdAut: $('#addQtdAut').val(),
        qtBO: $('#addQtBO').val(),
        qtARV: $('#addQtARV').val(),
        qtdARD: $('#addQtdARD').val(),
        qtdImg: $('#addQtdImg').val(),
        qtdTestes: $('#addQtdTestes').val()
    };
}

$(document).ready(function() {
    // Carregar registros
    $.get(API_URL, renderTable);

    // Adicionar registro
    $('.btn-primary').click(function() {
        const data = getFormData();
        $.ajax({
            url: API_URL,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(getFormData()),
            success: function() {
                $('#adicionarModal').modal('hide');
                $.get(API_URL, renderTable);
                $('#addForm')[0].reset();
            }
        });
    });

    // Editar Registro
    $(document).on('click', '#btnEditar', function() {
        const id = $(this).data('id');
        $.get(`${API_URL}/${id}`, function(rso) {
            $('#editId').val(rso._id);
            $('#editNumRSO').val(rso.numRSO);
            $('#editData').val(rso.data);
            $('#editNumPPRi').val(rso.numPPRi);
            $('#editEncEq').val(rso.encEq);
            $('#editVtr').val(rso.vtr);
            $('#editBop').val(rso.bop);
            $('#editTpSvc').val(rso.tpSvc);
            $('#editAux1').val(rso.aux1);
            $('#editAux2').val(rso.aux2);
            $('#editAux3').val(rso.aux3);
            $('#editHrInicio').val(rso.hrInicio);
            $('#editQtdFisc').val(rso.qtdFisc);
            $('#editQtdAut').val(rso.qtdAut);
            $('#editQtBO').val(rso.qtBO);
            $('#editQtARV').val(rso.qtARV);
            $('#editQtdARD').val(rso.qtdARD);
            $('#editQtdImg').val(rso.qtdImg);
            $('#editQtdTestes').val(rso.qtdTestes);
            $('#editarModal').modal('show');
        });
    });


    //Salvar Edição
    $('#salvarEdicao').click(function() {
        const id = $('#editId').val();
        const data = {
            numRSO: $('#editNumRSO').val(),
            data: $('#editData').val(),
            numPPRi: $('#editNumPPRi').val(),
            encEq: $('#editEncEq').val(),
            vtr: $('#editVtr').val(),
            bop: $('#editBop').val(),
            tpSvc: $('#editTpSvc').val(),
            aux1: $('#editAux1').val(),
            aux2: $('#editAux2').val(),
            aux3: $('#editAux3').val(),
            hrInicio: $('#editHrInicio').val(),
            qtdFisc: $('#editQtdFisc').val(),
            qtdAut: $('#editQtdAut').val(),
            qtBO: $('#editQtBO').val(),
            qtARV: $('#editQtARV').val(),
            qtdARD: $('#editQtdARD').val(),
            qtdImg: $('#editQtdImg').val(),
            qtdTestes: $('#editQtdTestes').val()
        };
        $.ajax({
            url: `${API_URL}/${id}`,
            type: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function() {
                $('#editarModal').modal('hide');
                $.get(API_URL, renderTable);
            }
        });
    });
    

    // Exibir detalhes
    $(document).on('click', '.btn-details', function() {
        const id = $(this).data('id');
        $.get(`${API_URL}/${id}`, function(rso) {
            let html = `
                <div class="mb-2"><strong style="color:#0d6efd;">ID:</strong> ${rso._id}</div>
                <div class="mb-2"><strong style="color:#0d6efd;">RSO Num:</strong> ${rso.numRSO}</div>
                <div class="mb-2"><strong style="color:#0d6efd;">Data:</strong> ${rso.data}</div>
                <div class="mb-2"><strong style="color:#0d6efd;">Viatura:</strong> ${rso.vtr}</div>
                <div class="mb-2"><strong style="color:#0d6efd;">Encarregado:</strong> ${rso.encEq}</div>
                <hr>
            `;
            const camposSecundarios = [
                'bop','tpSvc','aux1','aux2','aux3','hrInicio','qtdFisc','qtdAut','qtBO','qtARV','qtdARD','qtdImg','qtdTestes'
            ];
            camposSecundarios.forEach(campo => {
                html += `<div class="mb-2"><strong>${campo}:</strong> ${rso[campo] || ''}</div>`;
            });
            html += `
                <div class="mt-3 text-end">
                    <button class="btn btn-warning" id="btnEditar" data-id="${rso._id}" data-bs-dismiss="modal">
                        <i class="bi bi-pencil"></i> Editar
                    </button>
                </div>
            `;
            $('#detalhesModal .modal-body').html(html);
        });
    });

    // Excluir registro
    $(document).on('click', '.btn-delete', function() {
        const id = $(this).data('id');
        if (confirm('Tem certeza que deseja excluir este registro?')) {
            $.ajax({
                url: `${API_URL}/${id}`,
                type: 'DELETE',
                success: function() {
                    $.get(API_URL, renderTable);
                }
            });
        }
    });
});
</script>

</body>
</html>
